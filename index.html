<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tiny Town Builder: a 3D town building game for kids aged 4 to 10.">
<title>Tiny Town Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  html, body { margin: 0; }
  :root {
    /* space kept clear of notches, rounded corners and the home bar on phones */
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left, 0px);
    --safe-r: env(safe-area-inset-right, 0px);
  }
  /* Layout: a floating 3D diorama island fills the screen; chunky toy-block panels float over it:
     town name + counts top-left, camera rail on the right, build tray along the bottom. */
  :root {
    --sky: #8fd3ff;
    --ink: #23324a;
    --ink-soft: #5b6c86;
    --panel: #ffffff;
    --panel-2: #eef6ff;
    --edge: #c4d6ee;
    --sun: #ffc93c;
    --sun-edge: #e0a514;
    --coral: #ff6f59;
    --coral-soft: #ffe1db;
    --font-display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    color-scheme: light;
  }
  html { height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
    overscroll-behavior: none;
  }
  button { touch-action: manipulation; }
  #app { position: relative; height: 100%; overflow: hidden; background: linear-gradient(#8fd3ff, #dff4ff); }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

  .panel {
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 18px;
    box-shadow: 0 4px 0 var(--edge);
  }

  /* Town name + counts */
  .top {
    position: absolute;
    top: calc(12px + var(--safe-t));
    left: max(16px, var(--safe-l));
    max-width: calc(100% - 96px - var(--safe-r));
    padding: 6px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .name-row { display: flex; align-items: center; gap: 6px; }
  #townName {
    font: 800 1.6rem/1.1 var(--font-display);
    color: var(--ink);
    border: 0;
    background: transparent;
    width: 11ch;
    min-width: 0;
    padding: 2px 4px;
    border-radius: 8px;
    user-select: text;
    -webkit-user-select: text;
  }
  #townName:hover { background: var(--panel-2); }
  .pencil { font-size: 0.95rem; color: var(--ink-soft); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 0.95rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 800; }

  /* Camera rail */
  .rail {
    position: absolute;
    top: calc(12px + var(--safe-t));
    right: max(16px, var(--safe-r));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rail-more { display: flex; flex-direction: column; gap: 8px; }
  .rail .more-btn { display: none; }
  .rbtn {
    width: 48px; height: 48px;
    display: grid; place-items: center;
    font-size: 1.35rem; font-weight: 800; line-height: 1;
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 14px;
    box-shadow: 0 4px 0 var(--edge);
    transition: transform .1s, box-shadow .1s;
  }
  .rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .rbtn:disabled { opacity: .45; cursor: default; }
  .rbtn.pulse { animation: hint-nudge .8s ease; }
  .rbtn[aria-pressed="true"] { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 4px 0 var(--sun-edge); }
  .rbtn.warn { background: var(--coral-soft); border-color: var(--coral); box-shadow: 0 4px 0 var(--coral); font-size: .72rem; width: 48px; }
  .rail .gap { height: 4px; }

  /* Build tray */
  .tray {
    position: absolute;
    left: 0; right: 0; bottom: calc(12px + var(--safe-b));
    padding-left: max(16px, var(--safe-l));
    padding-right: max(16px, var(--safe-r));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .tray > * { pointer-events: auto; max-width: 100%; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 14px 4px 10px;
    font-weight: 800; font-size: 1rem;
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .tab .ico { font-size: 1.25rem; }
  .tab[aria-selected="true"] { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 3px 0 var(--sun-edge); }

  .tray-body { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 100%; }
  .tray-body > * { max-width: 100%; }
  /* the one big button that opens and closes the build tray */
  .build-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 26px 8px 20px;
    font-weight: 800; font-size: 1.3rem; line-height: 1.2;
    background: var(--sun);
    border: 2px solid var(--sun-edge);
    border-radius: 999px;
    box-shadow: 0 4px 0 var(--sun-edge);
    transition: transform .1s, box-shadow .1s;
  }
  .build-btn .ico { font-size: 1.5rem; }
  .build-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--sun-edge); }
  .build-btn[aria-expanded="true"] { background: var(--panel); border-color: var(--edge); box-shadow: 0 4px 0 var(--edge); font-size: 1rem; padding: 4px 18px 4px 14px; }
  .build-btn[aria-expanded="true"] .ico { font-size: 1rem; }
  .rbtn.age-btn { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 4px 0 var(--sun-edge); font-size: 1.4rem; }

  /* "How old are you?" */
  .age-pick {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 16px max(16px, var(--safe-r)) 16px max(16px, var(--safe-l));
    background: rgba(35, 50, 74, .45);
  }
  .age-card { position: relative; width: min(520px, 100%); padding: 18px 18px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .age-card .card-x { position: absolute; top: 10px; right: 10px; }
  .age-hi { font-size: 2.6rem; line-height: 1; }
  .age-card h1 { margin: 0; font-size: 1.9rem; line-height: 1.1; text-wrap: balance; }
  .ages { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .age {
    width: 64px; height: 64px; border-radius: 50%;
    font-weight: 800; font-size: 1.9rem; line-height: 1;
    background: var(--c); color: #fff;
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--c), 0 5px 0 2px rgba(35, 50, 74, .25);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .18);
  }
  .age:active { transform: translateY(3px); }
  .age[aria-pressed="true"] { box-shadow: 0 0 0 4px var(--ink), 0 5px 0 4px rgba(35, 50, 74, .25); }
  .age-modes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; color: var(--ink-soft); font-weight: 700; font-size: .95rem; }

  .shelf { display: flex; gap: 10px; align-items: stretch; padding: 10px; }
  .items { display: flex; gap: 8px; overflow-x: auto; min-width: 0; scrollbar-width: thin; padding: 6px 2px 8px; }
  .item {
    flex: none;
    width: 82px; min-height: 82px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    background: var(--panel-2);
    border: 2px solid var(--edge);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--edge);
    transition: transform .12s, box-shadow .12s, border-color .12s;
    padding: 4px;
  }
  .item .ico { font-size: 2.1rem; line-height: 1.15; }
  .item .lbl { font-weight: 700; font-size: .82rem; line-height: 1.1; text-align: center; }
  .item:hover { transform: translateY(-2px); }
  .item[aria-pressed="true"] { background: #fff; border-color: var(--coral); box-shadow: 0 6px 0 var(--coral); transform: translateY(-4px); }
  .item.eraser { background: var(--coral-soft); }
  .divider { width: 2px; background: var(--edge); border-radius: 2px; flex: none; margin-block: 8px; }

  .toast {
    position: absolute;
    left: 50%; top: calc(96px + var(--safe-t));
    transform: translate(-50%, 0);
    max-width: calc(100% - 32px);
    width: max-content;
    padding: 8px 18px;
    font-weight: 700; font-size: 1.1rem; text-align: center;
    background: var(--ink); color: #fff;
    border-radius: 999px;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .toast.off { opacity: 0; transform: translate(-50%, -8px); }
  [hidden] { display: none !important; }

  /* Building card (opens when you tap a building) */
  .card {
    position: absolute;
    left: 50%;
    bottom: var(--card-bottom, 200px);
    transform: translateX(-50%);
    width: min(440px, calc(100% - 32px));
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .card-head > .ico { font-size: 2.3rem; line-height: 1; flex: none; }
  .card-text { min-width: 0; }
  .card-title { font-weight: 800; font-size: 1.2rem; line-height: 1.15; text-wrap: balance; }
  .card-sub { color: var(--ink-soft); font-weight: 500; font-size: .95rem; line-height: 1.25; }
  .card-x {
    margin-left: auto; flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 1rem;
    background: var(--panel-2); border: 2px solid var(--edge); border-radius: 50%;
  }
  .card-actions { display: flex; gap: 8px; }
  .cbtn {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    padding: 6px 4px 8px;
    font-weight: 800; font-size: .9rem; line-height: 1.1;
    background: var(--panel-2);
    border: 2px solid var(--edge);
    border-radius: 14px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .cbtn .ico { font-size: 1.45rem; line-height: 1.2; }
  .cbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .cbtn.go { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 3px 0 var(--sun-edge); }
  .cbtn.danger { background: var(--coral-soft); border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); }
  /* paint pots: wall colour on top, roof colour below */
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .swatch {
    width: 44px; height: 44px; flex: none;
    border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--edge), 0 3px 0 2px var(--edge);
  }
  .swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--coral), 0 3px 0 3px var(--coral); }
  .swatches .cbtn { flex: 0 0 auto; min-width: 64px; }
  .name-edit { display: flex; gap: 8px; align-items: stretch; }
  .name-edit input {
    flex: 1 1 auto; min-width: 0;
    font: 800 1.15rem/1.2 var(--font-display); color: var(--ink);
    padding: 6px 10px;
    border: 2px solid var(--edge); border-radius: 12px; background: #fff;
    user-select: text; -webkit-user-select: text;
  }
  .name-edit .cbtn { flex: 0 0 52px; }

  /* "Pick something to build" bubble, shown while nothing is selected */
  .pick-hint {
    font-weight: 800; font-size: 1.05rem;
    padding: 6px 16px;
    background: var(--sun); color: var(--ink);
    border: 2px solid var(--sun-edge);
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--sun-edge);
    animation: hint-bob 1.6s ease-in-out infinite;
  }
  .pick-hint.nudge { animation: hint-nudge .5s ease-out, hint-bob 1.6s ease-in-out .5s infinite; }
  .tray.idle.open .shelf { animation: shelf-glow 1.6s ease-in-out infinite; }
  .tray.idle:not(.open) .build-btn { animation: build-glow 1.6s ease-in-out infinite; }
  @keyframes build-glow { 50% { box-shadow: 0 4px 0 var(--sun-edge), 0 0 0 7px rgba(255, 201, 60, .45); } }
  @keyframes hint-bob { 50% { transform: translateY(-4px); } }
  @keyframes hint-nudge { 30% { transform: scale(1.15); } 60% { transform: scale(.95); } }
  @keyframes shelf-glow { 50% { box-shadow: 0 4px 0 var(--edge), 0 0 0 5px rgba(255, 201, 60, .55); } }

  @media (max-width: 560px) {
    #townName { font-size: 1.3rem; width: 9ch; }
    .stats { font-size: .82rem; }
    .item { width: 70px; min-height: 72px; }
    .item .ico { font-size: 1.8rem; }
    .item .lbl { font-size: .74rem; }
    .tab { font-size: .88rem; padding: 3px 10px 3px 8px; }
    .tab .lbl-long { display: none; }
    .shelf { padding: 6px 8px; gap: 6px; }
    .toast { top: calc(108px + var(--safe-t)); font-size: .95rem; }
  }
  @media (max-height: 720px) and (min-width: 601px) and (min-height: 501px) {
    .rbtn { width: 44px; height: 44px; font-size: 1.15rem; border-radius: 12px; }
    .rbtn.warn { width: 44px; font-size: .64rem; }
    .rail, .rail-more { gap: 6px; }
    .rail .gap { display: none; }
  }

  /* phones (upright or sideways): only 🎯, 🌙 and ⋯ on the right; ⋯ opens the rest */
  @media (max-width: 600px), (max-height: 500px) {
    .rail .more-btn { display: grid; }
    .stats .w { display: none; }
    .rail { gap: 8px; }
    .rail .gap { display: none; }
    .rbtn { width: 44px; height: 44px; font-size: 1.2rem; border-radius: 13px; }
    .rbtn.warn { width: 44px; font-size: .64rem; }
    .rail-more {
      display: none;
      position: absolute; top: 0; right: calc(100% + 8px);
      grid-template-columns: repeat(2, 44px);
      gap: 8px; padding: 8px;
      background: var(--panel); border: 2px solid var(--edge); border-radius: 18px;
      box-shadow: 0 4px 0 var(--edge);
    }
    .rail.open .rail-more { display: grid; }
    .rail.open .more-btn { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 4px 0 var(--sun-edge); }
    .top { max-width: calc(100% - 84px - var(--safe-r)); padding: 4px 12px 6px; }
    #townName { font-size: 1.15rem; width: 10ch; }
    .pencil { font-size: .8rem; }
    .stats { font-size: .74rem; gap: 2px 8px; }
    .tray { gap: 6px; bottom: calc(8px + var(--safe-b)); }
    .tabs { gap: 5px; padding-bottom: 4px; }
    .tab { font-size: .82rem; padding: 3px 9px 3px 7px; gap: 4px; }
    .tab .ico { font-size: 1.1rem; }
    .shelf { padding: 4px 6px; gap: 6px; border-radius: 16px; }
    .items { gap: 6px; padding: 5px 2px 7px; }
    .item { width: 64px; min-height: 64px; border-radius: 14px; }
    .item .ico { font-size: 1.6rem; }
    .item .lbl { font-size: .7rem; }
    .pick-hint { font-size: .9rem; padding: 4px 12px; }
    .toast { top: calc(84px + var(--safe-t)); font-size: .92rem; padding: 6px 14px; }
    .card { padding: 10px 12px 12px; gap: 8px; }
    .card-head > .ico { font-size: 1.9rem; }
    .card-title { font-size: 1.05rem; }
    .card-sub { font-size: .85rem; }
    .cbtn { font-size: .78rem; padding: 4px 2px 6px; }
    .cbtn .ico { font-size: 1.25rem; }
  }
  /* phone turned sideways: little height, so trim the extras */
  @media (max-height: 500px) {
    .stats { display: none; }
    .tabs { padding-bottom: 2px; }
    .item { width: 58px; min-height: 54px; }
    .item .ico { font-size: 1.35rem; }
    .pick-hint { font-size: .82rem; padding: 3px 10px; }
    .toast { top: calc(56px + var(--safe-t)); }
    .card-sub { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item, .rbtn, .toast { transition: none; }
    .pick-hint, .pick-hint.nudge, .tray.idle.open .shelf, .tray.idle:not(.open) .build-btn, .rbtn.pulse { animation: none; }
  }
  /* Little Builders (4–7): bigger things to tap, and fewer buttons */
  .little .item { width: 100px; min-height: 100px; }
  .little .item .ico { font-size: 2.7rem; }
  .little .item .lbl { font-size: .95rem; }
  .little .build-btn:not([aria-expanded="true"]) { font-size: 1.6rem; padding: 10px 34px 10px 26px; }
  .little .build-btn:not([aria-expanded="true"]) .ico { font-size: 1.9rem; }
  .little #rotL, .little #rotR, .little #turn, .little #clear { display: none; }
  @media (max-width: 600px), (max-height: 500px) {
    .little .item { width: 78px; min-height: 78px; }
    .little .item .ico { font-size: 2.1rem; }
    .little .item .lbl { font-size: .8rem; }
    .build-btn { font-size: 1.15rem; }
    .age { width: 56px; height: 56px; font-size: 1.6rem; }
    .age-card h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="Your 3D town. Pick something from the tray, then tap the grass to build."></canvas>

  <header class="top panel">
    <div class="name-row">
      <input id="townName" maxlength="22" value="Sunny Town" aria-label="Town name" spellcheck="false">
      <span class="pencil" aria-hidden="true">✏️</span>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="rail" id="rail" role="toolbar" aria-label="Look around">
    <button class="rbtn" id="home" title="Back to the village (H)" aria-label="Back to the village">🎯</button>
    <button class="rbtn" id="night" title="Day or night (N)" aria-label="Switch to night">🌙</button>
    <button class="rbtn" id="undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>↩️</button>
    <button class="rbtn" id="redo" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>↪️</button>
    <button class="rbtn more-btn" id="moreBtn" title="More buttons" aria-label="More buttons" aria-expanded="false" aria-controls="railMore">⋯</button>
    <div class="rail-more" id="railMore">
      <button class="rbtn" id="rotL" title="Spin town left (Q)" aria-label="Spin town left">⟲</button>
      <button class="rbtn" id="rotR" title="Spin town right (E)" aria-label="Spin town right">⟳</button>
      <button class="rbtn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">＋</button>
      <button class="rbtn" id="zoomOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
      <div class="gap"></div>
      <button class="rbtn" id="turn" title="Turn the building (R)" aria-label="Turn the building">🔄</button>
      <button class="rbtn" id="weather" title="Change the weather (W)" aria-label="Make it rain">☀️</button>
      <button class="rbtn" id="music" title="Music on or off" aria-label="Turn music on" aria-pressed="false">🎵</button>
      <button class="rbtn" id="mute" title="Sound and voice on or off" aria-label="Turn sound and voice off">🔊</button>
      <button class="rbtn age-btn" id="ageBtn" title="Change age" aria-label="Change age">?</button>
      <button class="rbtn" id="clear" title="Start a new empty town" aria-label="Start a new empty town">🗑️</button>
    </div>
  </div>

  <div class="card panel" id="card" role="dialog" aria-labelledby="cardTitle" hidden>
    <div class="card-head">
      <span class="ico" id="cardIco" aria-hidden="true"></span>
      <div class="card-text">
        <div class="card-title" id="cardTitle"></div>
        <div class="card-sub" id="cardSub"></div>
      </div>
      <button class="card-x" id="cardClose" aria-label="Close">✕</button>
    </div>
    <div class="card-actions" id="cardActions">
      <button class="cbtn go" id="cAgain"><span class="ico">🎉</span>Again!</button>
      <button class="cbtn" id="cPaint"><span class="ico">🎨</span>Paint</button>
      <button class="cbtn" id="cGrow"><span class="ico">⭐</span>Grow</button>
      <button class="cbtn" id="cSwap"><span class="ico">🪄</span>Change</button>
      <button class="cbtn" id="cFriend"><span class="ico">❤️</span>Friend</button>
      <button class="cbtn" id="cRide"><span class="ico">🎢</span>Ride</button>
      <button class="cbtn" id="cName"><span class="ico">✏️</span>Name</button>
    </div>
    <div class="card-actions" id="cardActions2">
      <button class="cbtn" id="cMove"><span class="ico">✋</span>Move</button>
      <button class="cbtn" id="cTurn"><span class="ico">🔄</span>Turn</button>
      <button class="cbtn danger" id="cRemove"><span class="ico">🗑️</span>Remove</button>
    </div>
    <div class="swatches" id="paintRow" hidden></div>
    <div class="name-edit" id="nameRow" hidden>
      <input id="nameIn" maxlength="16" placeholder="Type a name" aria-label="Name" spellcheck="false" autocomplete="off">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const N = 32;               // board is N x N tiles
  const SAVE_KEY = 'tiny-town-v2';
  const OLD_SAVE_KEY = 'tiny-town-v1';   // 16x16 towns from the first version; never deleted
  const OLD_OFFSET = [4, 8];             // where a 16x16 town lands on the big board (clear of the river)
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- small helpers ---------- */
  const rngSeed = s => () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const newSeed = () => (Math.random() * 1e9) | 0;
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const inB = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
  const idx = (x, z) => z * N + x;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const tileWorld = (x, z) => new THREE.Vector3(x - N / 2 + 0.5, 0, z - N / 2 + 0.5);

  /* ---------- terrain: a lake with a beach in the north-east, a river running south across a beach into the sea ---------- */
  const LAKE = { x: 25.5, z: 6.5, r: 3.6 };
  const MOUNT = { x: 25.5, z: 0, r: 3.2 };   // rocky tiles under the mountain behind the lake
  const riverX = z => 23 + Math.round(1.5 * Math.sin(z * .35));
  const SEA_Y = -.32, SHORE = 3.6;               // sea level, and how far the south beach runs out before the water
  const MOUTH_X = riverX(N - 1) + 1 - N / 2;     // where the river leaves the board
  const PIER = { x: -4.5, z0: N / 2 + .4, z1: N / 2 + 7 };   // the harbour pier on the south beach
  const TERRAIN = new Array(N * N);
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) {
    const d = Math.hypot(x + .5 - LAKE.x, z + .5 - LAKE.z);
    const rx = riverX(z);
    let t = 'grass';
    if (Math.hypot(x + .5 - MOUNT.x, z + .5 - MOUNT.z) < MOUNT.r) t = 'rock';
    else if (d < LAKE.r || (z > LAKE.z && (x === rx || x === rx + 1))) t = 'water';
    else if (d < LAKE.r + 1.6) t = 'sand';
    else if (z === N - 1) t = 'sand';            // the top of the beach in the south
    TERRAIN[z * N + x] = t;
  }
  const terrainAt = (x, z) => TERRAIN[z * N + x];
  const isWater = (x, z) => inB(x, z) && TERRAIN[z * N + x] === 'water';
  const isRock = (x, z) => inB(x, z) && TERRAIN[z * N + x] === 'rock';

  /* ---------- three.js setup ---------- */
  const app = document.getElementById('app');
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0xe2f5ff, 60, 140);
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);

  const hemi = new THREE.HemisphereLight(0xdff2ff, 0x6a8f4a, 0.6);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sun.position.set(9, 18, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  // the shadow box follows the camera (see updateCamera), so shadows stay sharp on a big board
  Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 80 });
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);
  scene.add(sun.target);

  /* materials */
  const MATS = {};
  const mat = c => MATS[c] || (MATS[c] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, flatShading: true }));
  // smooth-shaded: for round, soft things like tree tops and people
  const SOFTS = {};
  const soft = c => SOFTS[c] || (SOFTS[c] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.75, metalness: 0 }));
  const winMat = new THREE.MeshStandardMaterial({ color: 0x9fd3ff, roughness: 0.3, emissive: 0xffc86b, emissiveIntensity: 0 });
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff3c4, roughness: 0.4, emissive: 0xffd36b, emissiveIntensity: 0 });
  // shimmering water: three moving waves make soft colour bands and little sparkles
  const waterUniforms = { uTime: { value: 0 }, uNight: { value: 0 } };
  const WATER_VS = `
    varying vec3 vW; varying vec2 vUv;
    void main() { vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
  const waterMat = new THREE.ShaderMaterial({
    uniforms: waterUniforms, vertexShader: WATER_VS,
    fragmentShader: `
      uniform float uTime; uniform float uNight; varying vec3 vW;
      void main() {
        float a = sin(vW.x * 2.3 + uTime * 1.2) + sin(vW.z * 3.1 - uTime * 1.7) + sin((vW.x + vW.z) * 1.7 + uTime * .8);
        vec3 c = mix(vec3(.16, .52, .80), vec3(.38, .76, .94), .5 + a / 6.0);
        c += smoothstep(2.2, 2.9, a) * .45;
        c = mix(c, c * vec3(.22, .28, .55), uNight);
        gl_FragColor = vec4(c, 1.0);
      }`,
  });
  // the sea all around the island: turquoise near the shore, deep blue further out, waves breaking white on the coast.
  // It fades into the sky with the fog, so it reaches the horizon
  const seaMat = new THREE.ShaderMaterial({
    fog: true,
    uniforms: { uTime: waterUniforms.uTime, uNight: waterUniforms.uNight, fogColor: { value: new THREE.Color() }, fogNear: { value: 1 }, fogFar: { value: 2000 } },
    vertexShader: `
      varying vec3 vW;
      #include <fog_pars_vertex>
      void main() {
        vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz;
        vec4 mvPosition = viewMatrix * w; gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      uniform float uTime; uniform float uNight; varying vec3 vW;
      #include <fog_pars_fragment>
      void main() {
        // how far from the coast: the island plus the beach in the south
        vec2 q = abs(vW.xz - vec2(0., ${(SHORE / 2).toFixed(2)})) - vec2(${(N / 2).toFixed(2)}, ${(N / 2 + SHORE / 2).toFixed(2)});
        float d = length(max(q, 0.)) + min(max(q.x, q.y), 0.);
        float a = sin(vW.x * 1.1 + uTime * .9) + sin(vW.z * 1.5 - uTime * 1.2) + sin((vW.x - vW.z) * .8 + uTime * .6);
        vec3 c = mix(vec3(.33, .79, .84), vec3(.15, .54, .79), smoothstep(0., 3.5, d));
        c = mix(c, vec3(.07, .33, .60), smoothstep(5., 24., d));
        float sp = sin(vW.x * 5.3 + uTime * 1.7) + sin(vW.z * 6.1 - uTime * 1.3) + sin((vW.x + vW.z) * 4.2 + uTime * 2.1);
        c *= .95 + a * .025;
        c += smoothstep(2.55, 2.95, sp) * .22 * (1. - smoothstep(10., 40., d));   // little glints of sun
        float foam = smoothstep(1., 0., d) * (.5 + .5 * sin(d * 6. + uTime * 2.2)) + smoothstep(.3, 0., d);
        c = mix(c, vec3(.95, .98, 1.), clamp(foam, 0., 1.) * .75);
        c = mix(c, c * vec3(.22, .28, .55), uNight);
        gl_FragColor = vec4(c, 1.0);
        #include <fog_fragment>
      }`,
  });
  const asMat = m => (typeof m === 'string' ? mat(m) : m);
  const cA = new THREE.Color(), cB = new THREE.Color();
  const mixHex = (a, b, k) => '#' + cA.set(a).lerp(cB.set(b), k).getHexString();

  function mesh(geo, m) {
    const o = new THREE.Mesh(geo, asMat(m));
    o.castShadow = true; o.receiveShadow = true;
    return o;
  }
  // y is the bottom of the shape
  function box(g, w, h, d, c, x = 0, y = 0, z = 0) { const o = mesh(new THREE.BoxGeometry(w, h, d), c); o.position.set(x, y + h / 2, z); g.add(o); return o; }
  function cyl(g, rt, rb, h, c, x = 0, y = 0, z = 0, seg = 10) { const o = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), c); o.position.set(x, y + h / 2, z); g.add(o); return o; }
  function cone(g, r, h, c, x = 0, y = 0, z = 0, seg = 8) { const o = mesh(new THREE.ConeGeometry(r, h, seg), c); o.position.set(x, y + h / 2, z); g.add(o); return o; }
  function ball(g, r, c, x = 0, y = 0, z = 0, detail = 0) { const o = mesh(new THREE.IcosahedronGeometry(r, detail), c); o.position.set(x, y, z); g.add(o); return o; }
  function gable(g, w, d, h, c, y, x = 0, z = 0) {
    const s = new THREE.Shape();
    s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
    geo.translate(0, 0, -d / 2);
    const o = mesh(geo, c); o.position.set(x, y, z); g.add(o); return o;
  }
  const SIGNS = {};
  function sign(g, text, bg, fg, w, h, x, y, z) {
    const key = text + bg + fg;
    if (!SIGNS[key]) {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
      const c = cv.getContext('2d');
      c.fillStyle = bg; c.fillRect(0, 0, 256, 64);
      c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
      let size = 44; c.font = `800 ${size}px "Baloo 2", sans-serif`;
      while (c.measureText(text).width > 236 && size > 20) { size -= 2; c.font = `800 ${size}px "Baloo 2", sans-serif`; }
      c.fillText(text, 128, 36);
      SIGNS[key] = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) });
    }
    const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), SIGNS[key]);
    o.position.set(x, y, z); g.add(o); return o;
  }

  /* ---------- baking: fewer draw calls ---------- */
  // Merge a model's plain coloured parts into one mesh (and window / light parts into one each),
  // so a house costs 2-3 draw calls instead of ~15. Parts named in userData stay separate so they can move.
  const vcMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .85, metalness: 0, flatShading: true });
  const vcSoft = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .75, metalness: 0 });
  const _m4 = new THREE.Matrix4(), _inv = new THREE.Matrix4();
  function bake(g) {
    g.updateMatrixWorld(true);
    const keep = new Set();
    for (const v of Object.values(g.userData)) for (const o of [].concat(v)) if (o && o.isObject3D) o.traverse(c => keep.add(c));
    _inv.copy(g.matrixWorld).invert();
    const buckets = new Map(), done = [];
    g.traverse(o => {
      if (!o.isMesh || keep.has(o) || !o.material.isMeshStandardMaterial) return;   // signs, water, glows stay as they are
      const m = o.material;
      const key = m === winMat || m === lightMat ? m : m.flatShading ? vcMat : vcSoft;
      const geo = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()).applyMatrix4(_m4.multiplyMatrices(_inv, o.matrixWorld));
      if (!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push({ geo, color: m.color, vc: m.vertexColors ? geo.attributes.color : null });
      done.push(o);
    });
    for (const o of done) o.parent.remove(o);
    for (const [material, parts] of buckets) {
      let n = 0;
      for (const p of parts) n += p.geo.attributes.position.count;
      const pos = new Float32Array(n * 3), nor = new Float32Array(n * 3), col = material.vertexColors ? new Float32Array(n * 3) : null;
      let off = 0;
      for (const p of parts) {
        const a = p.geo.attributes, c = a.position.count;
        pos.set(a.position.array, off * 3);
        nor.set(a.normal.array, off * 3);
        if (col && p.vc) col.set(p.vc.array, off * 3);
        else if (col) for (let i = 0; i < c; i++) { const j = (off + i) * 3; col[j] = p.color.r; col[j + 1] = p.color.g; col[j + 2] = p.color.b; }
        off += c;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
      if (col) geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      geo.computeBoundingSphere();
      const mm = new THREE.Mesh(geo, material);
      mm.castShadow = true; mm.receiveShadow = true;
      g.add(mm);
    }
    return g;
  }

  /* soft round puffs: chimney smoke, building dust, waterfall mist */
  function softTexture(inner, outer) {
    const cv = document.createElement('canvas'); cv.width = cv.height = 64;
    const c = cv.getContext('2d'), gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer);
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(cv);
  }
  const puffTex = softTexture('rgba(255,255,255,1)', 'rgba(255,255,255,0)');
  const puffs = [];
  function puff(pos, { vel, color = 0xffffff, size = .25, grow = 1.5, life = 2, alpha = .6 }) {
    if (puffs.length > 140) return;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: puffTex, color, transparent: true, depthWrite: false, opacity: 0 }));
    s.position.copy(pos); s.scale.setScalar(size);
    scene.add(s);
    puffs.push({ s, t: 0, life, vel, size, grow, alpha });
  }
  function runPuffs(dt) {
    for (let i = puffs.length - 1; i >= 0; i--) {
      const p = puffs[i]; p.t += dt;
      const k = p.t / p.life;
      if (k >= 1) { scene.remove(p.s); p.s.material.dispose(); puffs.splice(i, 1); continue; }
      p.s.position.addScaledVector(p.vel, dt);
      p.s.scale.setScalar(p.size * (1 + k * p.grow));
      p.s.material.opacity = p.alpha * Math.sin(k * Math.PI);
    }
  }
  function dust(x, z, w = 1, h = 1) {
    if (reduceMotion) return;
    const cx = x + w / 2 - N / 2, cz = z + h / 2 - N / 2;
    for (let i = 0; i < 10; i++) {
      const a = Math.random() * Math.PI * 2, r = .3 + Math.random() * .2;
      puff(new THREE.Vector3(cx + Math.cos(a) * w * r, .08, cz + Math.sin(a) * h * r),
        { vel: new THREE.Vector3(Math.cos(a) * .6, .25, Math.sin(a) * .6), color: 0xe9dcc0, size: .28, grow: 1.4, life: .7, alpha: .75 });
    }
  }

  // street lamps light the ground at night with a fake pool of light
  const poolMat = new THREE.MeshBasicMaterial({
    map: softTexture('rgba(255,214,120,1)', 'rgba(255,214,120,0)'),
    transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending,
  });
  const poolGeo = new THREE.PlaneGeometry(1.9, 1.9);

  /* ---------- models (front faces +z, 1 unit = 1 tile) ---------- */
  // creamy walls and bright toy roofs
  const WALLS = ['#fff4de', '#ffe8c2', '#fdf3e7', '#ffe1cf', '#e8f4ff', '#fff7c8', '#effbe4', '#ffe9f2'];
  const ROOFS = ['#e8553f', '#f4b63a', '#3f7fd9', '#e8553f', '#5aa7e8', '#e7703f'];
  const FAMILIES = ['Rivera', 'Khan', 'Smith', 'Okafor', 'Lee', 'Patel', 'Novak', 'Garcia', 'Sato', 'Haddad', 'Jones', 'Ahmed', 'Rossi', 'Kim', 'Silva', 'Brown'];

  /* building kit: soft toy blocks, thick roofs with eaves, framed windows, doors with a step */
  const RBOX = new Map();
  // a box with softly rounded edges (y is the bottom)
  function rbox(g, w, h, d, c, x = 0, y = 0, z = 0, r = .025) {
    r = Math.min(r, w / 2 - .001, h / 2 - .001, d / 2 - .001);
    const key = `${w},${h},${d},${r}`;
    let geo = RBOX.get(key);
    if (!geo) {
      const sh = new THREE.Shape(), hw = w / 2 - r, hh = h / 2 - r;
      sh.moveTo(-hw, -hh); sh.lineTo(hw, -hh); sh.lineTo(hw, hh); sh.lineTo(-hw, hh); sh.closePath();
      geo = new THREE.ExtrudeGeometry(sh, { depth: d - 2 * r, bevelEnabled: true, bevelThickness: r, bevelSize: r, bevelSegments: 2, curveSegments: 1 });
      geo.translate(0, 0, -(d - 2 * r) / 2);
      RBOX.set(key, geo);
    }
    const o = mesh(geo, c); o.position.set(x, y + h / 2, z); g.add(o); return o;
  }
  // a thick pitched roof whose eaves hang over the walls, with rows of tiles and a ridge.
  // The ridge runs front to back; alongX turns it for long buildings.
  function roof(g, w, d, h, c, y, wall, alongX) {
    if (alongX) { const p = new THREE.Group(); p.rotation.y = Math.PI / 2; g.add(p); roof(p, d, w, h, c, y, wall); return; }
    const over = .07, T = .05, k = h / (w / 2), ang = Math.atan(k);
    const run = w / 2 + over, L = run / Math.cos(ang), D = d + over * 2;
    const dark = mixHex(c, '#000000', .22);
    for (const sd of [-1, 1]) {
      const slab = mesh(new THREE.BoxGeometry(L, T, D), c);
      slab.rotation.z = -sd * ang;
      slab.position.set(sd * run / 2, y + h - k * run / 2 + T / 2 / Math.cos(ang), 0);
      for (let i = 1; i < 4; i++) {
        const t = mesh(new THREE.BoxGeometry(.014, .008, D), dark);
        t.position.set(-L / 2 + i * L / 4, T / 2, 0); slab.add(t);
      }
      g.add(slab);
    }
    const ridge = mesh(new THREE.CylinderGeometry(.032, .032, D + .02, 8), dark);
    ridge.rotation.x = Math.PI / 2; ridge.position.set(0, y + h + T * .9, 0); g.add(ridge);
    gable(g, w, d, h, wall, y);
  }
  // a window with a white frame, a cross and a sill, facing +z unless turned (y is its middle)
  function win(g, w, h, x, y, z, ry = 0, shutter) {
    const p = new THREE.Group(); p.position.set(x, y, z); p.rotation.y = ry; g.add(p);
    box(p, w + .035, h + .035, .02, '#ffffff', 0, -(h + .035) / 2, 0);
    box(p, w, h, .03, winMat, 0, -h / 2, 0);
    box(p, .01, h, .036, '#ffffff', 0, -h / 2, 0);
    box(p, w, .01, .036, '#ffffff', 0, -.005, 0);
    box(p, w + .06, .018, .045, '#ffffff', 0, -h / 2 - .035, .012);
    if (shutter) for (const sd of [-1, 1]) box(p, w * .42, h + .02, .014, shutter, sd * (w / 2 + w * .21 + .022), -(h + .02) / 2, 0);
    return p;
  }
  // a round window
  function porthole(g, rad, x, y, z) {
    const ring = cyl(g, rad + .014, rad + .014, .02, '#ffffff', 0, 0, 0, 16); ring.rotation.x = Math.PI / 2; ring.position.set(x, y, z);
    const gl = cyl(g, rad, rad, .03, winMat, 0, 0, 0, 16); gl.rotation.x = Math.PI / 2; gl.position.set(x, y, z + .003);
  }
  // a front door with a frame, a knob, a stone step and a little porch roof (y is the ground)
  function door(g, w, h, c, x, z, porch) {
    box(g, w + .04, h + .03, .02, '#ffffff', x, .04, z);
    box(g, w, h, .03, c, x, .04, z + .004);
    ball(g, .012, '#ffd23f', x + w * .3, .04 + h * .45, z + .022);
    rbox(g, w + .1, .04, .09, '#d6cdb9', x, 0, z + .045, .01);
    if (porch) rbox(g, w + .12, .025, .11, porch, x, .04 + h + .035, z + .05, .01);
  }
  const bush = (g, r, x, z, s = .07) => ball(g, s, soft(pick(r, ['#4fb548', '#46a84d', '#5cbf4a', '#3f9f55'])), x, s * .8, z, 1);
  // a white picket fence round the front garden, with a gap for the path

  /* residents: a big round head with a kind face, a hoodie, and arms and legs on joints so they can walk and wave */
  const SKINS = ['#f6d0b1', '#eab68f', '#d39b6f', '#a8714a', '#7a4e32', '#ffe0c4'];
  const HAIRS = ['#6b3a1e', '#3b2a20', '#1c1c1c', '#c68b3c', '#e7c46b', '#a0401c'];
  const CLOTHES = ['#e8553f', '#3f7fd9', '#f4b63a', '#8a5cd6', '#21b07a', '#ff7a3d', '#ff6fa5', '#2bb3c0'];

  function makeResident(r, { kid = false, royal = false } = {}) {
    const g = new THREE.Group();
    const skinHex = pick(r, SKINS), skin = soft(skinHex), hair = soft(pick(r, HAIRS));
    const top = royal ? '#8a3fd1' : pick(r, CLOTHES), pants = soft(pick(r, PANTS));
    const legH = kid ? .07 : .095, bodyH = kid ? .1 : .12, headR = kid ? .088 : .08;
    const hipY = legH + .02, shY = hipY + bodyH - .025;
    // legs swing from the hips, arms from the shoulders; each is baked on its own so it can move
    const legs = [-1, 1].map(sd => {
      const p = new THREE.Group(); p.position.set(sd * .026, hipY, 0); g.add(p);
      cyl(p, .021, .02, legH, pants, 0, -legH, 0, 8);
      ball(p, .026, soft('#ffffff'), 0, -legH - .004, .012, 0).scale.set(1, .6, 1.35);

    ball(g, .034, soft(top), 0, shY, -.042, 0).scale.set(1.3, .75, .8);                // hood
    box(g, .056, .024, .012, mixHex(top, '#000000', .18), 0, hipY + .018, .052);       // pocket
    for (const sd of [-1, 1]) box(g, .005, .036, .005, '#ffffff', sd * .012, shY - .045, .056);   // hood strings
    const arms = [-1, 1].map(sd => {
      const p = new THREE.Group(); p.position.set(sd * .066, shY, 0); p.rotation.z = sd * .15; g.add(p);
      cyl(p, .017, .016, .075, soft(top), 0, -.075, 0, 8);
      ball(p, .02, skin, 0, -.086, 0, 0);

    });
    const head = new THREE.Group(); head.position.set(0, shY + .02, 0); g.add(head);
    const hy = headR * .95;
    ball(head, headR, skin, 0, hy, 0, 2);
    for (const sd of [-1, 1]) ball(head, .02, skin, sd * headR, hy - .006, 0, 1).scale.set(.6, 1, .85);
    const style = Math.floor(r() * 4);
    if (style === 3) {   // a cap
      const capC = soft(royal ? '#ffd23f' : pick(r, CLOTHES));
      ball(head, headR * 1.05, capC, 0, hy + headR * .22, -headR * .05, 2).scale.set(1, .6, 1);
      box(head, headR * 1.2, .008, headR * .8, capC, 0, hy + headR * .38, headR * .8);
    } else {
      ball(head, headR * 1.07, hair, 0, hy + headR * .2, -headR * .12, 2).scale.set(1, .8, 1);
      if (style === 0) for (const x of [-.035, 0, .035]) ball(head, .03, hair, x, hy + headR * .66, headR * .58, 1);
      if (style === 1) ball(head, .036, hair, 0, hy + headR * 1.02, -headR * .45, 1);
      if (style === 2) for (const sd of [-1, 1]) ball(head, .03, hair, sd * headR * .98, hy - .012, -headR * .32, 1);
    }
    // the face sits on the curve of the head: fz gives the front of the head at a spot
    const fz = (x, dy) => Math.sqrt(Math.max(0, headR * headR - x * x - dy * dy));
    for (const sd of [-1, 1]) ball(head, .016, soft('#ff9e9e'), sd * .05, hy - .02, fz(.05, .02) - .004, 1).scale.set(1, .6, .4);
    if (style !== 3) for (const sd of [-1, 1]) {   // eyebrows (a cap's brim hides them)
      const b = box(head, .03, .008, .008, hair, sd * .033, hy + .042, 0);
      b.position.z = fz(.033, .046) - .001; b.rotation.set(0, sd * .4, -sd * .18);

    const mz = fz(0, .03) + .003;
    if (r() < .5) {   // a big open smile

      ball(eyes, .0165, iris, x, -.001, z0 + .0055, 2).scale.set(1, 1.12, .45);
      ball(eyes, .009, soft('#0d0d0d'), x, -.001, z0 + .009, 1).scale.set(1, 1.1, .4);
      ball(eyes, .0052, soft('#ffffff'), x + .006, .007, z0 + .0125, 1);
      ball(eyes, .0025, soft('#ffffff'), x - .005, -.007, z0 + .012, 1);

    bake(eyes);
    eyes.traverse(o => { o.castShadow = false; });
    head.userData.eyes = eyes;
    bake(head);
    Object.assign(g.userData, { legs, arms, head, eyes });
    // a bigger, invisible target so small fingers can tap them
    const hit = new THREE.Mesh(hitGeo, hitMat); hit.position.y = .24; hit.castShadow = false; g.add(hit);

  // the resident's day: returns true when it has moved them itself this frame
  function stepPerson(m, dt, time) {
    if (m.waveT > 0) { m.waveT -= dt; if (m.waveT <= 0) m.faceCam = false; }
    if (m.home && !objs.has(m.home)) m.home = null;
    const st = m.state;
    if (st === 'inside' && m.visiting) {
      if ((m.stateT -= dt) <= 0 || !objs.has(m.visiting)) leaveVisit(m);
      return true;
    }
    if (st === 'inside') {
      if (!m.home) {
        if (moving && moving.residents && moving.residents.includes(m)) return true;   // their house is being moved
        m.state = 'out'; m.g.visible = true; m.g.scale.setScalar(m.base);
        return false;
      }
      if (!night && (m.stateT -= dt) <= 0) comeOut(m);
      return true;
    }
    if (st === 'enter' || st === 'exit') {
      m.stateT += dt;
      const k = Math.min(1, m.stateT / .7);
      const [a, b] = st === 'enter' ? [m.outPt, m.inPt] : [m.inPt, m.outPt];
      m.pos.lerpVectors(a, b, k);
      m.yaw = Math.atan2(b.x - a.x, b.z - a.z);
      m.g.scale.setScalar(m.base * Math.max(.001, st === 'enter' ? 1 - k * k : k));
      m.g.position.set(m.pos.x, .01, m.pos.z); m.g.rotation.y = m.yaw;
      animPerson(m, dt, time, true);
      if (k < 1) return true;
      m.g.scale.setScalar(m.base);
      if (st === 'enter') { m.state = 'inside'; m.g.visible = false; m.stateT = m.visiting ? 3 + Math.random() * 4 : .5 + Math.random() * 3.5; return true; }
      m.state = 'out';
      if (m.greet) { m.greet = false; m.waveT = 1.8; m.faceCam = true; m.jump = 1; sfx.hi(); }
      else if (Math.random() < .5) { m.waveT = 1.2; m.faceCam = true; }
      if (night) m.homeDelay = 2.5;   // came to the door at night: say hi, then back to bed
      return true;
    }
    if (st === 'leave') {
      if ((m.stateT -= dt) <= 0) { m.state = 'gone'; floatEmoji('💨', m.pos.clone().setY(.4)); removeMover(m); return true; }
      return false;
    }
    // out and about: at night, head home
    if (m.home && night && !m.goingHome) { m.goingHome = true; m.homeDelay = m.homeDelay ?? Math.random() * 2.5; if (m.errand) { m.errand = null; m.path = null; } }
    if (m.goingHome) {
      if (!night) { m.goingHome = false; m.path = null; m.homeDelay = undefined; return false; }
      if (!m.path && (m.homeDelay -= dt) <= 0) {
        const d = doorTile(m.home);
        m.path = d ? findPath(m.to, d) : null;
        if (!m.path) { m.path = []; }   // can't walk there: pop in from where they are
        m.wait = 0;
      }
      if (m.path && !m.path.length && m.t >= 1) { m.homeDelay = undefined; goIn(m); return true; }
      return false;
    }
    // in the daytime, now and then, set off somewhere
    if (!night && !m.temp && !m.trick) {
      if (m.errand && m.path && !m.path.length && m.t >= 1) { arrive(m); return m.state === 'enter'; }
      if (!m.path && (m.errandT = (m.errandT ?? 5 + Math.random() * 20) - dt) <= 0) { m.errandT = 15 + Math.random() * 25; startErrand(m); }
    }
    return false;
  }
  // arms and legs swing as they walk, an arm waves, the head looks around, the eyes blink
  function animPerson(m, dt, time, walking) {
    const u = m.g.userData;
    m.walkK += ((walking ? 1 : 0) - m.walkK) * Math.min(1, dt * 10);
    const sw = Math.sin(time * 11 + m.phase) * .7 * m.walkK;
    u.legs[0].rotation.x = sw; u.legs[1].rotation.x = -sw;
    u.arms[0].rotation.x = -sw * .8;
    const waving = m.waveT > 0;
    const rz = waving ? 2.6 + Math.sin(time * 14) * .35 : .15;
    u.arms[1].rotation.z += (rz - u.arms[1].rotation.z) * Math.min(1, dt * 12);
    u.arms[1].rotation.x = waving ? 0 : sw * .8;
    const look = !walking && !waving ? Math.sin(time * .7 + m.phase) * .5 : 0;
    u.head.rotation.y += (look - u.head.rotation.y) * Math.min(1, dt * 4);

    for (const m of movers) {
      if (!m.it.vehicle) continue;
      const k = idx(m.from.x, m.from.z);
      if (!vehAt.has(k)) vehAt.set(k, []);
      vehAt.get(k).push(m);
    }
  }
  const NONE = [];
  // how fast and how high each kind bobs as it walks: [speed, height]
  const BOB = { walk: [11, .018], dog: [14, .012], cat: [10, .006], bird: [13, .07], cow: [7, .006], sheep: [10, .01], horse: [12, .012], chicken: [16, .012], rabbit: [9, .08], ducks: [14, .012] };
  // traffic lights all change together: green, yellow, then red, when cars wait in front of them
  // (litTiles: road tiles a light looks after; redTiles: the ones cars must not drive onto right now)
  const redTiles = new Set(), litTiles = new Set();
  function updateTraffic(time) {
    redTiles.clear(); litTiles.clear();
    const k = time % 11, state = k < 5 ? 'g' : k < 6.5 ? 'y' : 'r';
    for (const o of objs) {
      const tiles = o.type === 'trafficlight' ? DIRS.map(([dx, dz]) => [o.x + dx, o.z + dz]).filter(([x, z]) => isRoad(x, z))
        : o.light ? [[o.x, o.z]] : null;
      if (!tiles) continue;
      o.group.userData.light = state;
      for (const [x, z] of tiles) { litTiles.add(idx(x, z)); if (state === 'r') redTiles.add(idx(x, z)); }
    }
  }
  const onTile = (m, p) => (m.from.x === p.x && m.from.z === p.z) || (m.to.x === p.x && m.to.z === p.z);
  // someone on foot is on (or stepping onto) this crossing
  const walkerOn = p => movers.some(w => !w.it.vehicle && w.g.visible && w.state === 'out' && onTile(w, p) && !(w.from.x === p.x && w.from.z === p.z && w.t > .65));
  // safe to step onto this crossing? no car on it or about to drive on, and a red light for the cars if there is one
  function safeToCross(p) {
    const k = idx(p.x, p.z);
    if (litTiles.has(k) && !redTiles.has(k)) return false;
    return !movers.some(v => v.it.vehicle && ((v.from.x === p.x && v.from.z === p.z) || (v.to.x === p.x && v.to.z === p.z && (v.t > .5 || (v.t > .2 && (v.sirenT > 0 || !redTiles.has(k)))))));
  }
  // someone ended up on a road (an old save, or the road was built under them): hop to the nearest pavement or grass
  function hopOff(m) {
    const p = moverTile(m);
    for (let r = 1; r <= 4; r++) for (let dz = -r; dz <= r; dz++) for (let dx = -r; dx <= r; dx++) {
      if (Math.max(Math.abs(dx), Math.abs(dz)) !== r || !walkable(p.x + dx, p.z + dz)) continue;
      m.from = { x: p.x + dx, z: p.z + dz }; m.to = { ...m.from }; m.t = 1; m.path = null; m.jump = 1;
      m.pos.copy(tileWorld(m.from.x, m.from.z));
      return true;
    }
    return false;
  }
  // buses wait at bus stops, and sometimes someone gets off
  function busStop(m) {
    const k = idx(m.from.x, m.from.z), now = performance.now();
    if (m.lastStop && m.lastStop.k === k && now - m.lastStop.t < 20000) return;
    const stop = DIRS.map(([dx, dz]) => cellAt(m.from.x + dx, m.from.z + dz)).find(c => c && c.type === 'busstop');
    if (!stop) return;
    m.lastStop = { k, t: now }; m.wait = 2.5;
    if (Math.random() < .6) setTimeout(() => spawnVisitor(stop, pick(Math.random, ['kid', 'adult'])), 900);
  }
  function stepMover(m, dt, time) {
    if (m.carried) {
      // dangling in the air under your finger
      m.g.position.set(m.pos.x, .42 + Math.sin(time * 6) * .03, m.pos.z);
      m.yaw += dt * .8; m.g.rotation.y = m.yaw; m.g.rotation.z = Math.sin(time * 4) * .15;
      if (m.g.userData.legs) animPerson(m, dt, time, true);
      if (m.g.userData.limbs) { const sw = Math.sin(time * 18) * .5; m.g.userData.limbs.forEach((l, i) => { l.rotation.x = i % 2 ? sw : -sw; }); }
      return;
    }
    if (m.life !== undefined) { m.life -= dt; if (m.life <= 0) { removeMover(m); return; } }
    if (m.it.person && stepPerson(m, dt, time)) return;
    if (m.it.vehicle) {
      if (!isRoad(m.to.x, m.to.z) || !isRoad(m.from.x, m.from.z)) { removeMover(m); return; }
    } else if (!walkable(m.to.x, m.to.z)) {
      if (walkable(m.from.x, m.from.z)) { m.to = { ...m.from }; m.t = 1; } else if (!hopOff(m)) { removeMover(m); return; }
    }
    let moving = false;
    if (m.wait > 0) m.wait -= dt;
    else {
      let blocked = false;
      if (m.it.vehicle) {
        for (const o of [...(vehAt.get(idx(m.from.x, m.from.z)) || NONE), ...(vehAt.get(idx(m.to.x, m.to.z)) || NONE)]) {
          if (o === m) continue;
          const same = o.from.x === m.from.x && o.from.z === m.from.z && o.to.x === m.to.x && o.to.z === m.to.z;
          if (same && o.t > m.t && o.t - m.t < .55) { blocked = true; break; }
          const ahead = o.from.x === m.to.x && o.from.z === m.to.z && !(o.to.x === m.from.x && o.to.z === m.from.z);
          if (ahead && o.t + 1 - m.t < .55) { blocked = true; break; }
        }
        if (!blocked && !(m.sirenT > 0) && m.t > .36 && m.t < .5 && redTiles.has(idx(m.to.x, m.to.z)) && !redTiles.has(idx(m.from.x, m.from.z))) blocked = true;
        // everyone stops for people on a zebra crossing, even fire trucks
        if (!blocked && m.t > .3 && m.t < .5 && isCrossing(m.to.x, m.to.z) && walkerOn(m.to)) blocked = true;
      }
      if (!blocked && !(m.waveT > 0)) {
        m.t += dt * m.speed; moving = true;
      }
      if (m.t >= 1) {
        const n = nextTile(m);
        if (n && !m.it.vehicle && isCrossing(n.x, n.z) && !isCrossing(m.to.x, m.to.z) && !safeToCross(n)) {
          // wait at the kerb: look left, look right
          if (m.path) m.path.unshift(n);
          m.t = 1; moving = false; m.wait = .5;
        } else if (n) { m.from = m.to; m.to = n; m.t -= 1; if (m.type === 'bus') busStop(m); }
        else { m.t = 1; moving = false; }
        if (!m.it.vehicle && !m.path && !isCrossing(m.to.x, m.to.z) && m.wait <= 0 && Math.random() < (m.type === 'cat' ? .35 : .18)) {
          m.wait = .6 + Math.random() * (m.type === 'cat' ? 4 : 2.2);
          if (m.it.person && Math.random() < .3) m.waveT = 1.2;   // stop, look around, and sometimes wave
        }
      }
    }
    tmpA.copy(tileWorld(m.from.x, m.from.z));
    tmpB.copy(tileWorld(m.to.x, m.to.z));
    tmpP.lerpVectors(tmpA, tmpB, Math.min(m.t, 1));
    const dx = tmpB.x - tmpA.x, dz = tmpB.z - tmpA.z;
    if (dx || dz) {
      if (m.it.vehicle) { tmpP.x += -dz * .2; tmpP.z += dx * .2; }
      else {
        const off = isRoad(m.to.x, m.to.z) && isWater(m.to.x, m.to.z) ? (m.off < 0 ? -.36 : .36) : m.off;   // bridges: keep to the footway by the railing
        tmpP.x += -dz * off; tmpP.z += dx * off;
      }
    } else moving = false;
    const want = m.waveT > 0 && m.faceCam ? Math.atan2(camera.position.x - m.pos.x, camera.position.z - m.pos.z) : (dx || dz) ? Math.atan2(dx, dz) : m.yaw;
    let turnBy = want - m.yaw; turnBy = Math.atan2(Math.sin(turnBy), Math.cos(turnBy));
    m.yaw += turnBy * Math.min(1, dt * 9);
    m.pos.lerp(tmpP, Math.min(1, dt * 10));
    const lf = isWater(m.from.x, m.from.z) ? BRIDGE_LIFT : 0, lt = isWater(m.to.x, m.to.z) ? BRIDGE_LIFT : 0;
    let y = (m.it.vehicle ? .03 : .01) + lf + (lt - lf) * Math.min(m.t, 1);
    const [bobSpeed, bobHeight] = BOB[m.type] || BOB.walk;
    if (!m.it.vehicle && moving && m.wait <= 0) y += Math.abs(Math.sin(time * bobSpeed + m.phase)) * bobHeight;
    if (m.type === 'bird' && m.jump <= 0 && Math.random() < dt * .06) m.jump = 1;   // birds take off now and then
    if (m.jump > 0) {
      const bird = m.type === 'bird';
      m.jump = Math.max(0, m.jump - dt * (bird ? .7 : 2.2));
      y += Math.sin((1 - m.jump) * Math.PI) * (m.it.vehicle ? .15 : bird ? 1.1 : .3);
    }
    if (m.g.userData.wings) {
      const f = moving || m.jump > 0 ? Math.sin(time * 28 + m.phase) * .7 : 0;
      m.g.userData.wings[0].rotation.z = f;
      m.g.userData.wings[1].rotation.z = -f;
    }
    m.g.position.set(m.pos.x, y, m.pos.z);
    m.g.rotation.y = m.yaw;
    const pet = m.g.userData;
    if (pet.limbs) {
      // four legs walk in diagonal pairs; dogs wag (faster when they're happy), cats swish slowly
      m.walkK += ((moving && m.wait <= 0 ? 1 : 0) - m.walkK) * Math.min(1, dt * 10);
      const sw = Math.sin(time * BOB[m.type][0] + m.phase) * .55 * m.walkK;
      const pairs = pet.limbs.length === 2 ? [1, -1] : [1, -1, -1, 1];
      pet.limbs.forEach((l, i) => { l.rotation.x = sw * pairs[i]; });
      if (pet.tail) pet.tail.rotation.z = m.type === 'dog' ? Math.sin(time * (m.jump > 0 || m.trick ? 30 : 16) + m.phase) * .5 : Math.sin(time * 1.6 + m.phase) * .35;
    }
    if (m.trick) runTrick(m, dt);
    if (m.g.userData.legs) animPerson(m, dt, time, moving && m.wait <= 0);
    if (m.g.userData.siren) {
      m.sirenT = Math.max(0, (m.sirenT || 0) - dt);
      const on = (m.sirenT > 0 || nightK > .5) && Math.floor(time * 6) % 2 === 0;
      m.g.userData.siren[0].material = mat(on ? '#ff3b30' : '#8a1f1a');
      m.g.userData.siren[1].material = mat(on ? '#1d3f8f' : '#2979ff');
    }
  }

  /* ---------- loop ---------- */
  function resize() {
    const w = app.clientWidth, h = app.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(app);

  // slow device? after a few seconds, drop to lighter shadows and a lower resolution
  const perf = { frames: 0, time: 0, low: false };
  function checkSpeed(dt) {
    if (perf.low || perf.frames > 150) return;
    perf.frames++;
    if (perf.frames > 30) perf.time += dt;
    if (perf.frames === 150 && perf.time / 120 > 1 / 28) {
      perf.low = true;
      renderer.setPixelRatio(1);
      renderer.shadowMap.type = THREE.PCFShadowMap;
      sun.shadow.mapSize.set(1024, 1024);
      if (sun.shadow.map) { sun.shadow.map.dispose(); sun.shadow.map = null; }
      for (const m of movers) if (m.it.person) m.g.traverse(o => { o.castShadow = false; });   // people are many small meshes
      resize();
    }
  }
  let smokeT = 0, mistT = 0, sprayT = 0, fishT = 4;
  const fishes = [makeFish(), makeFish()];
  // somewhere in the open sea, away from the coast, the mountain and the harbour
  function seaSpot() {
    for (let i = 0; i < 30; i++) {
      const x = (Math.random() - .5) * (N + 16), z = -N / 2 - 8 + Math.random() * (N + SHORE + 16);
      const out = Math.max(Math.abs(x) - N / 2, z < 0 ? -N / 2 - z : z - N / 2 - SHORE, 0);
      if (out < 1.5 || Math.hypot(x - (MOUNT.x - N / 2), z + N / 2) < 6 || (Math.abs(x + 4.5) < 4 && z > N / 2)) continue;
      return [x, z, SEA_Y];
    }
    return [0, N / 2 + SHORE + 4, SEA_Y];
  }
  function jumpFish(dt) {
    fishT -= dt;
    if (fishT <= 0 && !reduceMotion) {
      fishT = 2.5 + Math.random() * 4;
      const f = fishes.find(f => !(f.userData.k > 0));
      if (f) {
        const lake = Math.random() < .35, a = Math.random() * 6.28, rr = Math.random() * 1.8;
        const [x, z, y] = lake ? [LAKE.x - N / 2 + Math.cos(a) * rr, LAKE.z - N / 2 + Math.sin(a) * rr, .012] : seaSpot();
        Object.assign(f.userData, { k: 1, x, z, y, a: Math.random() * 6.28 });
        f.rotation.set(0, f.userData.a, 0);
        puff(new THREE.Vector3(x, y + .03, z), { vel: new THREE.Vector3(0, .3, 0), color: 0xffffff, size: .12, grow: 1.6, life: .6, alpha: .7 });
      }
    }
    for (const f of fishes) {
      const u = f.userData;
      if (!(u.k > 0)) continue;
      u.k = Math.max(0, u.k - dt / 1.1);
      const p = 1 - u.k;
      f.visible = u.k > 0;
      f.position.set(u.x + Math.sin(u.a) * p * .9, u.y + Math.sin(p * Math.PI) * .55 - .05, u.z + Math.cos(u.a) * p * .9);
      f.rotation.x = (p - .5) * 2.4;
      if (u.k === 0) puff(new THREE.Vector3(f.position.x, u.y + .03, f.position.z), { vel: new THREE.Vector3(0, .35, 0), color: 0xffffff, size: .14, grow: 1.8, life: .7, alpha: .7 });
    }
  }
  function ambient(dt, time) {
    waterUniforms.uTime.value = time;
    jumpFish(dt);
    // chimney smoke from a random house now and then
    smokeT -= dt;
    if (smokeT <= 0 && !reduceMotion) {
      smokeT = .35;
      const homes = [];
      for (const o of objs) if (o.group.userData.chimney) homes.push(o);
      if (homes.length) {
        const h = homes[Math.floor(Math.random() * homes.length)];
        puff(h.group.localToWorld(h.group.userData.chimney.clone()),
          { vel: new THREE.Vector3(.1, .35, .04), color: 0xf2f2f2, size: .18, grow: 2.2, life: 2.6, alpha: .55 });
      }
    }
    // fountains splash
    sprayT -= dt;
    if (sprayT <= 0 && !reduceMotion) {
      sprayT = .1;
      for (const o of objs) {
        if (!o.group.userData.spray || Math.random() < .5) continue;
        puff(o.group.localToWorld(o.group.userData.spray.clone()),
          { vel: new THREE.Vector3((Math.random() - .5) * .5, .5, (Math.random() - .5) * .5), color: 0xdff4ff, size: .1, grow: 1.2, life: .7, alpha: .8 });
      }
    }
    // spray where the mountain stream lands in the lake
    if (!reduceMotion && Math.random() < dt * 9) {
      puff(new THREE.Vector3(springFoot.x + (Math.random() - .5) * .9, .05, springFoot.z + Math.random() * .3),
        { vel: new THREE.Vector3((Math.random() - .5) * .3, .28, .25), size: .32, grow: 1.8, life: 1.4, alpha: .45 });
    }
    // little splashes where the river meets the waves
    mistT -= dt;
    if (mistT <= 0 && !reduceMotion) {
      mistT = .3;
      puff(new THREE.Vector3(riverMouth.x + (Math.random() - .5) * 4, riverMouth.y, riverMouth.z + Math.random() * .4),
        { vel: new THREE.Vector3((Math.random() - .5) * .2, .12, .15), size: .2, grow: 1.6, life: 1.1, alpha: .5 });
    }
    for (const o of objs) {
      const u = o.group.userData;
      if (u.sway !== undefined) o.group.rotation.x = Math.sin(time * 1.3 + u.sway) * .03;
    }
    const a = time * .15, R = 1.9;
    boat.position.set(LAKE.x - N / 2 + Math.cos(a) * R, .01 + Math.sin(time * 2) * .015, LAKE.z - N / 2 + Math.sin(a) * R);
    boat.rotation.y = -a;
    stepVessels(dt, time);
    stepBeach(dt, time);
    for (const b of birds) {
      const u = b.userData;
      u.a += u.s * dt; u.t += dt;
      const flapping = u.t % u.cycle < u.flapFor;
      const f = flapping ? Math.sin(time * u.rate + u.r) : 0;
      b.position.set(u.cx + Math.cos(u.a) * u.r, u.h + Math.sin(time * .7 + u.r) * .25 + f * .03, u.cz + Math.sin(u.a) * u.r);
      b.rotation.y = Math.atan2(-Math.sin(u.a) * u.s, Math.cos(u.a) * u.s);   // face the way it flies
      b.rotation.z = Math.sign(u.s) * .28;                                     // lean into the turn
      const up = flapping ? f * .75 : .12, wrist = flapping ? f * .45 - .1 : .04;
      u.wings.forEach((w, i) => { const sd = i ? 1 : -1; w.rotation.z = sd * up; w.userData.tip.rotation.z = sd * wrist; });
    }
    fireflies.position.y = Math.sin(time * .8) * .08;
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const time = now / 1000;
    checkSpeed(dt);
    nightK += ((night ? 1 : 0) - nightK) * Math.min(1, dt * 2.5);
    applyLighting(time);
    updateCamera(dt);
    indexVehicles();
    updateTraffic(time);
    for (let i = movers.length - 1; i >= 0; i--) if (movers[i]) stepMover(movers[i], dt, time);
    ambient(dt, time);
    stepWeather(dt, time);
    stepMusic();
    if (selMover) { if (!movers.includes(selMover) || !selMover.g.visible) closeCard(); else selHl.position.set(selMover.pos.x, .12, selMover.pos.z); }
    for (const o of objs) {
      const u = o.group.userData;
      if (u.duck) {
        const d = u.duck.userData, a = time * .6 + d.phase;
        d.jump = Math.max(0, (d.jump || 0) - dt * 2);
        u.duck.position.set(Math.cos(a) * .22, .02 + Math.sin(time * 3) * .008 + Math.sin(d.jump * Math.PI) * .2, Math.sin(a) * .22);
        u.duck.rotation.y = -a;
      }
      if (u.flag) u.flag.rotation.y = Math.sin(time * 3) * .25;
      if (u.tick) u.tick(dt, time);
    }
    // lighthouse beams show at night, or for a moment when tapped
    let flash = 0;
    for (const o of objs) if (o.group.userData.flash > 0) { o.group.userData.flash -= dt; flash = 1; }
    beamMat.opacity = Math.max(nightK, flash) * .16;
    for (const o of objs) if (o.type === 'lighthouse') o.group.userData.keep[0].visible = beamMat.opacity > .01;
    const cloudTint = cA.set('#ffffff').lerp(cB.set('#56628c'), nightK);
    for (const c of clouds) {
      c.position.x += c.userData.speed * dt;
      if (c.position.x > 45) c.position.x = -45;
      const op = clamp((c.position.distanceTo(camera.position) - 12) / 10, 0, 1);
      for (const m of c.userData.mats) { m.opacity = op * .96; m.color.copy(cloudTint); }
      c.visible = op > .02;
    }
    runAnims(dt);
    runFloaters(dt);
    runPuffs(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  /* ---------- start ---------- */
  function start(hotData) {
    let data = hotData && hotData.town;
    if (!data) { try { const s = localStorage.getItem(SAVE_KEY); if (s) data = JSON.parse(s); } catch (e) { data = null; } }
    // first visit after the big-map update: bring the old 16x16 town across (the old save is kept)
    if (!data) { try { const s = localStorage.getItem(OLD_SAVE_KEY); if (s) data = JSON.parse(s); } catch (e) { data = null; } }
    if (data && data.size !== N) data = migrateV1(data);
    resize();
    cam.dist = cam.distT = fitDistance();
    applyAge();
    if (!age) openAgePick();
    loadTown(data || starterTown(), false);
    setTool('look');
    window.claude?.hot?.snapshot?.(() => ({ town: serialize() }));
    toast('Drag to look around. Tap a building to play!', 5000, false);   // trackpads: two-finger swipe also works
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  const fontsReady = document.fonts ? Promise.race([document.fonts.load('800 40px "Baloo 2"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  fontsReady.catch(() => {}).then(() => {
    window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  });
})();
</script>
</body>
</html>
