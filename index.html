<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tiny Town Builder: a 3D town building game for kids aged 5 to 13.">
<title>Tiny Town Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
  html, body { margin: 0; }
  /* Layout: a floating 3D diorama island fills the screen; chunky toy-block panels float over it:
     town name + counts top-left, camera rail on the right, build tray along the bottom. */
  :root {
    --sky: #8fd3ff;
    --ink: #23324a;
    --ink-soft: #5b6c86;
    --panel: #ffffff;
    --panel-2: #eef6ff;
    --edge: #c4d6ee;
    --sun: #ffc93c;
    --sun-edge: #e0a514;
    --coral: #ff6f59;
    --coral-soft: #ffe1db;
    --font-display: "Baloo 2", "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
    color-scheme: light;
  }
  html { height: 100%; box-sizing: border-box; }
  *, *::before, *::after { box-sizing: inherit; }
  body {
    height: 100%;
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  #app { position: relative; height: 100%; overflow: hidden; background: linear-gradient(#8fd3ff, #dff4ff); }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: pointer; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--coral); outline-offset: 2px; }

  .panel {
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 18px;
    box-shadow: 0 4px 0 var(--edge);
  }

  /* Town name + counts */
  .top {
    position: absolute;
    top: 12px;
    left: max(16px, env(safe-area-inset-left, 0px));
    max-width: calc(100% - 96px - env(safe-area-inset-right, 0px));
    padding: 6px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .name-row { display: flex; align-items: center; gap: 6px; }
  #townName {
    font: 800 1.6rem/1.1 var(--font-display);
    color: var(--ink);
    border: 0;
    background: transparent;
    width: 11ch;
    min-width: 0;
    padding: 2px 4px;
    border-radius: 8px;
    user-select: text;
    -webkit-user-select: text;
  }
  #townName:hover { background: var(--panel-2); }
  .pencil { font-size: 0.95rem; color: var(--ink-soft); }
  .stats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-weight: 700; font-size: 0.95rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--ink); font-weight: 800; }

  /* Camera rail */
  .rail {
    position: absolute;
    top: 12px;
    right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .rbtn {
    width: 48px; height: 48px;
    display: grid; place-items: center;
    font-size: 1.35rem; font-weight: 800; line-height: 1;
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 14px;
    box-shadow: 0 4px 0 var(--edge);
    transition: transform .1s, box-shadow .1s;
  }
  .rbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge); }
  .rbtn.warn { background: var(--coral-soft); border-color: var(--coral); box-shadow: 0 4px 0 var(--coral); font-size: .72rem; width: 48px; }
  .rail .gap { height: 4px; }

  /* Build tray */
  .tray {
    position: absolute;
    left: 0; right: 0; bottom: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .tray > * { pointer-events: auto; max-width: 100%; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 2px 6px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    display: flex; align-items: center; gap: 6px;
    padding: 4px 14px 4px 10px;
    font-weight: 800; font-size: 1rem;
    background: var(--panel);
    border: 2px solid var(--edge);
    border-radius: 999px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .tab .ico { font-size: 1.25rem; }
  .tab[aria-selected="true"] { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 3px 0 var(--sun-edge); }

  .shelf { display: flex; gap: 10px; align-items: stretch; padding: 10px; }
  .items { display: flex; gap: 8px; overflow-x: auto; min-width: 0; scrollbar-width: thin; padding: 6px 2px 8px; }
  .item {
    flex: none;
    width: 82px; min-height: 82px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    background: var(--panel-2);
    border: 2px solid var(--edge);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--edge);
    transition: transform .12s, box-shadow .12s, border-color .12s;
    padding: 4px;
  }
  .item .ico { font-size: 2.1rem; line-height: 1.15; }
  .item .lbl { font-weight: 700; font-size: .82rem; line-height: 1.1; text-align: center; }
  .item:hover { transform: translateY(-2px); }
  .item[aria-pressed="true"] { background: #fff; border-color: var(--coral); box-shadow: 0 6px 0 var(--coral); transform: translateY(-4px); }
  .item.eraser { background: var(--coral-soft); }
  .divider { width: 2px; background: var(--edge); border-radius: 2px; flex: none; margin-block: 8px; }

  .toast {
    position: absolute;
    left: 50%; top: 96px;
    transform: translate(-50%, 0);
    max-width: calc(100% - 32px);
    width: max-content;
    padding: 8px 18px;
    font-weight: 700; font-size: 1.1rem; text-align: center;
    background: var(--ink); color: #fff;
    border-radius: 999px;
    box-shadow: 0 4px 0 rgba(0,0,0,.18);
    transition: opacity .25s, transform .25s;
    pointer-events: none;
  }
  .toast.off { opacity: 0; transform: translate(-50%, -8px); }
  [hidden] { display: none !important; }

  /* Building card (opens when you tap a building) */
  .card {
    position: absolute;
    left: 50%;
    bottom: var(--card-bottom, 200px);
    transform: translateX(-50%);
    width: min(440px, calc(100% - 32px));
    padding: 12px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card-head { display: flex; align-items: center; gap: 10px; }
  .card-head > .ico { font-size: 2.3rem; line-height: 1; flex: none; }
  .card-text { min-width: 0; }
  .card-title { font-weight: 800; font-size: 1.2rem; line-height: 1.15; text-wrap: balance; }
  .card-sub { color: var(--ink-soft); font-weight: 500; font-size: .95rem; line-height: 1.25; }
  .card-x {
    margin-left: auto; flex: none;
    width: 36px; height: 36px;
    display: grid; place-items: center;
    font-weight: 800; font-size: 1rem;
    background: var(--panel-2); border: 2px solid var(--edge); border-radius: 50%;
  }
  .card-actions { display: flex; gap: 8px; }
  .cbtn {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 0;
    padding: 6px 4px 8px;
    font-weight: 800; font-size: .9rem; line-height: 1.1;
    background: var(--panel-2);
    border: 2px solid var(--edge);
    border-radius: 14px;
    box-shadow: 0 3px 0 var(--edge);
  }
  .cbtn .ico { font-size: 1.45rem; line-height: 1.2; }
  .cbtn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge); }
  .cbtn.go { background: var(--sun); border-color: var(--sun-edge); box-shadow: 0 3px 0 var(--sun-edge); }
  .cbtn.danger { background: var(--coral-soft); border-color: var(--coral); box-shadow: 0 3px 0 var(--coral); }

  @media (max-width: 560px) {
    #townName { font-size: 1.3rem; width: 9ch; }
    .stats { font-size: .82rem; }
    .rbtn { width: 42px; height: 42px; font-size: 1.15rem; }
    .rbtn.warn { width: 42px; font-size: .64rem; }
    .rail { gap: 6px; }
    .item { width: 70px; min-height: 72px; }
    .item .ico { font-size: 1.8rem; }
    .item .lbl { font-size: .74rem; }
    .tab { font-size: .88rem; padding: 3px 10px 3px 8px; }
    .tab .lbl-long { display: none; }
    .shelf { padding: 6px 8px; gap: 6px; }
    .toast { top: 108px; font-size: .95rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .item, .rbtn, .toast { transition: none; }
  }
</style>
</head>
<body>

<div id="app">
  <canvas id="c" aria-label="Your 3D town. Pick something from the tray, then tap the grass to build."></canvas>

  <header class="top panel">
    <div class="name-row">
      <input id="townName" maxlength="22" value="Sunny Town" aria-label="Town name" spellcheck="false">
      <span class="pencil" aria-hidden="true">✏️</span>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="rail" role="toolbar" aria-label="Look around">
    <button class="rbtn" id="rotL" title="Spin town left (Q)" aria-label="Spin town left">⟲</button>
    <button class="rbtn" id="rotR" title="Spin town right (E)" aria-label="Spin town right">⟳</button>
    <button class="rbtn" id="zoomIn" title="Zoom in (+)" aria-label="Zoom in">＋</button>
    <button class="rbtn" id="zoomOut" title="Zoom out (−)" aria-label="Zoom out">−</button>
    <div class="gap"></div>
    <button class="rbtn" id="turn" title="Turn the building (R)" aria-label="Turn the building">↪︎</button>
    <button class="rbtn" id="night" title="Day or night (N)" aria-label="Switch to night">🌙</button>
    <button class="rbtn" id="mute" title="Sound on or off" aria-label="Turn sound off">🔊</button>
    <button class="rbtn" id="clear" title="Start a new empty town" aria-label="Start a new empty town">🗑️</button>
  </div>

  <div class="card panel" id="card" role="dialog" aria-labelledby="cardTitle" hidden>
    <div class="card-head">
      <span class="ico" id="cardIco" aria-hidden="true"></span>
      <div class="card-text">
        <div class="card-title" id="cardTitle"></div>
        <div class="card-sub" id="cardSub"></div>
      </div>
      <button class="card-x" id="cardClose" aria-label="Close">✕</button>
    </div>
    <div class="card-actions" id="cardActions">
      <button class="cbtn go" id="cAgain"><span class="ico">🎉</span>Again!</button>
      <button class="cbtn" id="cMove"><span class="ico">✋</span>Move</button>
      <button class="cbtn" id="cTurn"><span class="ico">↪️</span>Turn</button>
      <button class="cbtn danger" id="cRemove"><span class="ico">🗑️</span>Remove</button>
    </div>
    <div class="card-actions" id="moveActions" hidden>
      <button class="cbtn" id="cMoveTurn"><span class="ico">↪️</span>Turn</button>
      <button class="cbtn danger" id="cCancel"><span class="ico">↩️</span>Put it back</button>
    </div>
  </div>

  <div class="toast off" id="toast" role="status" aria-live="polite"></div>

  <nav class="tray" aria-label="Build things">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="shelf panel">
      <div class="items" id="items" role="toolbar" aria-label="Things to build"></div>
      <div class="divider"></div>
      <button class="item eraser" id="eraser" aria-pressed="false" title="Remove things">
        <span class="ico">🧽</span><span class="lbl">Eraser</span>
      </button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const N = 16;               // board is N x N tiles
  const SAVE_KEY = 'tiny-town-v1';
  const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- small helpers ---------- */
  const rngSeed = s => () => {
    s |= 0; s = s + 0x6D2B79F5 | 0;
    let t = Math.imul(s ^ s >>> 15, 1 | s);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
  const newSeed = () => (Math.random() * 1e9) | 0;
  const pick = (r, a) => a[Math.floor(r() * a.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const inB = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
  const idx = (x, z) => z * N + x;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const tileWorld = (x, z) => new THREE.Vector3(x - N / 2 + 0.5, 0, z - N / 2 + 0.5);

  /* ---------- three.js setup ---------- */
  const app = document.getElementById('app');
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setClearColor(0x000000, 0);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 300);

  const hemi = new THREE.HemisphereLight(0xdff2ff, 0x6a8f4a, 0.6);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff1d6, 0.95);
  sun.position.set(9, 18, 7);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 60 });
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  /* materials */
  const MATS = {};
  const mat = c => MATS[c] || (MATS[c] = new THREE.MeshStandardMaterial({ color: c, roughness: 0.85, metalness: 0, flatShading: true }));
  const winMat = new THREE.MeshStandardMaterial({ color: 0x9fd3ff, roughness: 0.3, emissive: 0xffc86b, emissiveIntensity: 0 });
  const lightMat = new THREE.MeshStandardMaterial({ color: 0xfff3c4, roughness: 0.4, emissive: 0xffd36b, emissiveIntensity: 0 });
  const waterMat = new THREE.MeshStandardMaterial({ color: 0x4fc3f7, roughness: 0.15, metalness: 0.1 });
  const asMat = m => (typeof m === 'string' ? mat(m) : m);

  function mesh(geo, m) {
    const o = new THREE.Mesh(geo, asMat(m));
    o.castShadow = true; o.receiveShadow = true;
    return o;
  }
  // y is the bottom of the shape
  function box(g, w, h, d, c, x = 0, y = 0, z = 0) { const o = mesh(new THREE.BoxGeometry(w, h, d), c); o.position.set(x, y + h / 2, z); g.add(o); return o; }
  function cyl(g, rt, rb, h, c, x = 0, y = 0, z = 0, seg = 10) { const o = mesh(new THREE.CylinderGeometry(rt, rb, h, seg), c); o.position.set(x, y + h / 2, z); g.add(o); return o; }
  function cone(g, r, h, c, x = 0, y = 0, z = 0, seg = 8) { const o = mesh(new THREE.ConeGeometry(r, h, seg), c); o.position.set(x, y + h / 2, z); g.add(o); return o; }
  function ball(g, r, c, x = 0, y = 0, z = 0, detail = 0) { const o = mesh(new THREE.IcosahedronGeometry(r, detail), c); o.position.set(x, y, z); g.add(o); return o; }
  function gable(g, w, d, h, c, y, x = 0, z = 0) {
    const s = new THREE.Shape();
    s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.closePath();
    const geo = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: false });
    geo.translate(0, 0, -d / 2);
    const o = mesh(geo, c); o.position.set(x, y, z); g.add(o); return o;
  }
  const SIGNS = {};
  function sign(g, text, bg, fg, w, h, x, y, z) {
    const key = text + bg + fg;
    if (!SIGNS[key]) {
      const cv = document.createElement('canvas'); cv.width = 256; cv.height = 64;
      const c = cv.getContext('2d');
      c.fillStyle = bg; c.fillRect(0, 0, 256, 64);
      c.fillStyle = fg; c.textAlign = 'center'; c.textBaseline = 'middle';
      let size = 44; c.font = `800 ${size}px "Baloo 2", sans-serif`;
      while (c.measureText(text).width > 236 && size > 20) { size -= 2; c.font = `800 ${size}px "Baloo 2", sans-serif`; }
      c.fillText(text, 128, 36);
      SIGNS[key] = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv) });
    }
    const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), SIGNS[key]);
    o.position.set(x, y, z); g.add(o); return o;
  }

  /* ---------- models (front faces +z, 1 unit = 1 tile) ---------- */
  const WALLS = ['#ffd6a5', '#fdf0a0', '#c8f5b8', '#a8e6f5', '#f7c6f0', '#ffb3b3', '#f3f3f3', '#d9c8ff'];
  const ROOFS = ['#e05a47', '#3d6fb6', '#7a4e9e', '#2f8f6b', '#c4573a', '#5a5f6e'];
  const FAMILIES = ['Rivera', 'Khan', 'Smith', 'Okafor', 'Lee', 'Patel', 'Novak', 'Garcia', 'Sato', 'Haddad', 'Jones', 'Ahmed', 'Rossi', 'Kim', 'Silva', 'Brown'];

  function makeHouse(r) {
    const g = new THREE.Group();
    const wall = pick(r, WALLS), roof = pick(r, ROOFS);
    box(g, .64, .44, .6, wall);
    gable(g, .8, .72, .32, roof, .44);
    box(g, .15, .25, .03, '#7a4b2a', 0, 0, .3);
    box(g, .14, .14, .03, winMat, -.19, .2, .3);
    box(g, .14, .14, .03, winMat, .19, .2, .3);
    box(g, .03, .14, .14, winMat, .32, .2, 0);
    box(g, .03, .14, .14, winMat, -.32, .2, 0);
    box(g, .09, .2, .09, '#8d6e63', .18, .55, -.12);
    box(g, .24, .03, .12, '#d8cfc0', 0, 0, .38);
    g.userData.title = `The ${pick(r, FAMILIES)} family’s house`;
    return g;
  }
  function makeCottage(r) {
    const g = new THREE.Group();
    const wall = pick(r, WALLS), roof = pick(r, ROOFS);
    box(g, .58, .4, .58, wall);
    cone(g, .5, .4, roof, 0, .4, 0, 4).rotation.y = Math.PI / 4;
    box(g, .15, .24, .03, '#6b3f22', 0, 0, .29);
    const rw = cyl(g, .07, .07, .03, winMat, 0, 0, 0, 12);
    rw.rotation.x = Math.PI / 2; rw.position.set(.18, .25, .3);
    box(g, .12, .12, .03, winMat, -.18, .19, .29);
    ball(g, .08, '#3f9d48', -.27, .06, .34);
    ball(g, .08, '#3f9d48', .27, .06, .34);
    ball(g, .03, pick(r, ['#ff5d8f', '#ffd23f', '#b388ff']), .27, .13, .38);
    g.userData.title = `The ${pick(r, FAMILIES)} family’s cottage`;
    return g;
  }
  function makeFlats(r) {
    const g = new THREE.Group();
    const c = pick(r, ['#e9d8c4', '#c9d6e8', '#e8c4c4', '#d4e8c9', '#f0e0a8']);
    box(g, .76, 1.5, .76, c);
    box(g, .82, .06, .82, '#6d7480', 0, 1.5, 0);
    box(g, .2, .12, .16, '#9aa3ad', .15, 1.56, -.1);
    for (let row = 0; row < 4; row++) {
      const y = .42 + row * .27;
      for (const x of [-.18, .18]) {
        box(g, .15, .15, .03, winMat, x, y, .38);
        box(g, .03, .15, .15, winMat, .38, y, x);
        box(g, .03, .15, .15, winMat, -.38, y, x);
      }
    }
    box(g, .18, .28, .03, '#4a5568', 0, 0, .38);
    box(g, .28, .03, .12, '#6d7480', 0, .3, .43);
    g.userData.title = `${pick(r, ['Maple', 'Sunrise', 'Rainbow', 'Oak', 'Bluebell', 'Hilltop'])} Flats`;
    return g;
  }
  function makeCastle(r) {
    const g = new THREE.Group();
    const stone = '#cfc8bb', top = pick(r, ['#5b6ee1', '#b04fb5', '#e0525b', '#2f9e8f']);
    box(g, 1.5, .02, 1.5, '#d9cba5');
    box(g, 1.44, .48, .12, stone, 0, 0, .72);
    box(g, 1.44, .48, .12, stone, 0, 0, -.72);
    box(g, .12, .48, 1.44, stone, .72, 0, 0);
    box(g, .12, .48, 1.44, stone, -.72, 0, 0);
    for (let i = -3; i <= 3; i++) {
      const p = i * .2;
      box(g, .1, .1, .12, stone, p, .48, .72);
      box(g, .1, .1, .12, stone, p, .48, -.72);
      box(g, .12, .1, .1, stone, .72, .48, p);
      box(g, .12, .1, .1, stone, -.72, .48, p);
    }
    box(g, .32, .34, .04, '#5a3a22', 0, 0, .79);
    for (const x of [-.75, .75]) for (const z of [-.75, .75]) {
      cyl(g, .2, .22, .9, stone, x, 0, z);
      cone(g, .27, .42, top, x, .9, z, 10);
      box(g, .06, .12, .02, winMat, x, .55, z + .2);
    }
    box(g, .66, .95, .66, stone, 0, 0, -.05);
    box(g, .1, .16, .03, winMat, -.15, .55, .29);
    box(g, .1, .16, .03, winMat, .15, .55, .29);
    cone(g, .52, .5, top, 0, .95, -.05, 4).rotation.y = Math.PI / 4;

  /* ---------- the board ---------- */
  function makeBoard() {
    const cv = document.createElement('canvas'); cv.width = cv.height = 512;
    const c = cv.getContext('2d'); const t = 512 / N;
    for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) {
      c.fillStyle = (x + z) % 2 ? '#7fcf5c' : '#76c653';
      c.fillRect(x * t, z * t, t, t);
    }
    for (let i = 0; i < 900; i++) {
      c.fillStyle = Math.random() < .5 ? 'rgba(255,255,255,.12)' : 'rgba(30,90,20,.12)';
      c.fillRect(Math.random() * 512, Math.random() * 512, 2, 3);
    }
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const top = new THREE.MeshStandardMaterial({ map: tex, roughness: 1 });
    const grassSide = mat('#5aa43f'), dirt = mat('#9b6b43'), dirtDark = mat('#7d5434');
    const slab = new THREE.Mesh(new THREE.BoxGeometry(N, .14, N), [grassSide, grassSide, top, grassSide, grassSide, grassSide]);
    slab.position.y = -.07; slab.receiveShadow = true;
    scene.add(slab);
    const soil = new THREE.Mesh(new THREE.BoxGeometry(N - .1, 1, N - .1), dirt);
    soil.position.y = -.64; scene.add(soil);
    const under = new THREE.Mesh(new THREE.CylinderGeometry(N * .55, N * .2, 2.4, 7), dirtDark);
    under.position.y = -2.3; under.rotation.y = .3; scene.add(under);

      ghost.position.set(x0 + w / 2 - N / 2, it.vehicle ? .03 : (it.kind === 'mover' ? .01 : 0), z0 + h / 2 - N / 2);
      ghost.rotation.y = it.kind === 'build' ? r * Math.PI / 2 : 0;
    }
  }

  /* ---------- picking ---------- */
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hitPt = new THREE.Vector3();
  function setRay(e) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
  }
  function tileFromEvent(e) {
    setRay(e);
    if (!ray.ray.intersectPlane(groundPlane, hitPt)) return null;
    const x = Math.floor(hitPt.x + N / 2), z = Math.floor(hitPt.z + N / 2);
    return inB(x, z) ? { x, z } : null;
  }
  function moverFromEvent(e) {
    setRay(e);
    const hits = ray.intersectObjects(movers.map(m => m.g), true);
    if (!hits.length) return null;
    let o = hits[0].object;
    while (o && !movers.some(m => m.g === o)) o = o.parent;
    return movers.find(m => m.g === o) || null;
  }

  /* ---------- actions ---------- */
  function poke(m) {
    m.jump = 1;
    if (m.type === 'police') { sfx.siren(); m.sirenT = 3; }
    else if (m.it.vehicle) sfx.honk();
    else if (m.type === 'dog') { sfx.woof(); toast('Woof woof! 🐾', 1200); }
    else { sfx.hi(); toast(pick(Math.random, ['Hi there! 👋', 'Wheee!', 'I love this town!', 'Hello, mayor!', 'What a nice day!']), 1400); }
  }
  function eraseAt(tx, tz) {
    const ms = movers.filter(m => { const p = moverTile(m); return p.x === tx && p.z === tz; });
    if (ms.length) { ms.forEach(removeMover); sfx.erase(); changed(); return true; }
    const c = cellAt(tx, tz);
    if (c) { removeObj(c); sfx.erase(); changed(); return true; }
    return false;
  }
  /* ---------- tapping buildings ---------- */
  const v3 = new THREE.Vector3();
  function topOf(o) { return v3.set(o.group.position.x, TOPS[o.type] || 1, o.group.position.z).clone(); }
  // free tile next to a building, front side first
  function nearTile(o, ok) {
    const a = o.rot * Math.PI / 2, fx = Math.round(Math.sin(a)), fz = Math.round(Math.cos(a));
    const cx = o.x + (o.w - 1) / 2, cz = o.z + (o.h - 1) / 2;
    const list = [];
    for (let z = o.z - 1; z <= o.z + o.h; z++) for (let x = o.x - 1; x <= o.x + o.w; x++) {
      const inside = x >= o.x && x < o.x + o.w && z >= o.z && z < o.z + o.h;
      const corner = (x === o.x - 1 || x === o.x + o.w) && (z === o.z - 1 || z === o.z + o.h);
      if (!inside && !corner && ok(x, z)) list.push({ x, z, score: (x - cx) * fx + (z - cz) * fz + Math.random() * .1 });
    }
    list.sort((p, q) => q.score - p.score);
    return list[0] || null;
  }
  function spawnVisitor(o, type) {
    if (movers.filter(m => m.temp).length >= 25) return null;
    const t = nearTile(o, walkable);
    if (!t) return null;
    const m = addMover(type, t.x, t.z, newSeed());
    m.temp = true; m.life = 18 + Math.random() * 12; m.wait = 0; m.jump = 1;
    return m;
  }
  function spawnVehicle(o, type, msg) {
    const t = nearTile(o, isRoad);
    if (!t) { sfx.nope(); toast(`The ${ITEMS[type].label.toLowerCase()} needs a road to drive out! Build a road next to it. 🛣️`, 3000); return; }
    if (movers.filter(m => m.type === type).length >= 3) { toast(`All the ${ITEMS[type].label.toLowerCase()}s are already out!`); return; }
    const m = addMover(type, t.x, t.z, newSeed());
    m.temp = true; m.life = 22; m.wait = .2; m.sirenT = 22;
    sfx.siren(); toast(msg, 2200);
  }
  function play(o) {
    const g = o.group, top = topOf(o);
    switch (o.type) {
      case 'house': case 'cottage': case 'flats':
        sfx.knock(); squish(g); floatEmoji('❤️', top);
        spawnVisitor(o, pick(Math.random, ['kid', 'adult', 'kid', 'dog']));
        break;
      case 'castle':
        sfx.fanfare(); squish(g); floatEmoji('👑', top); floatEmoji('🎺', top, 2);
        spawnVisitor(o, 'adult');
        break;
      case 'school':
        sfx.bell(); floatEmoji('🔔', top);
        for (let i = 0; i < 3; i++) spawnVisitor(o, 'kid');
        toast('Ring ring! Time to play outside! 🎒', 1800);
        break;
      case 'hospital':
        floatEmoji('🩺', top);
        spawnVehicle(o, 'ambulance', 'Nee-naw! The ambulance is on its way! 🚑');
        break;
      case 'fire':
        floatEmoji('🧑‍🚒', top);
        spawnVehicle(o, 'firetruck', 'Nee-naw! The fire truck is going out! 🚒');
        break;
      case 'shop':
        sfx.chaching(); squish(g); floatEmoji(g.userData.emoji || '🛍️', top, 3);
        spawnVisitor(o, pick(Math.random, ['kid', 'adult']));
        break;
      case 'tree':
        sfx.tweet(); shake(g); floatEmoji(pick(Math.random, ['🍎', '🐦', '🍃', '🐛']), top);
        break;
      case 'pine':
        sfx.tweet(); shake(g); floatEmoji(pick(Math.random, ['🐿️', '🦉', '🌰']), top);
        break;
      case 'flowers':
        sfx.sparkle(); floatEmoji('🦋', top); floatEmoji('🐝', top);
        break;
      case 'pond':
        sfx.quack(); floatEmoji('💦', top, 2);
        if (g.userData.duck) g.userData.duck.userData.jump = 1;
        break;
      case 'lamp':
        sfx.sparkle(); floatEmoji('✨', top, 2); squish(g);
        break;
    }
  }

  /* ---------- building card ---------- */
  const cardEl = document.getElementById('card');
  const cardIco = document.getElementById('cardIco');
  const cardTitle = document.getElementById('cardTitle');
  const cardSub = document.getElementById('cardSub');
  const cardActions = document.getElementById('cardActions');
  const moveActions = document.getElementById('moveActions');
  const trayEl = document.querySelector('.tray');
  function showCard(icon, title, sub, isMove) {
    cardIco.textContent = icon;
    cardTitle.textContent = title;
    cardSub.textContent = sub;
    cardActions.hidden = !!isMove;
    moveActions.hidden = !isMove;
    app.style.setProperty('--card-bottom', (trayEl.offsetHeight + 24) + 'px');
    cardEl.hidden = false;
  }
  function markSelected() {
    const o = selected;
    if (!o) { selHl.visible = false; return; }
    selHl.visible = true;
    selHl.scale.set(o.w, o.h, 1);
    selHl.position.set(o.x + o.w / 2 - N / 2, .065, o.z + o.h / 2 - N / 2);
  }
  function openCard(o) {
    selected = o;
    const it = ITEMS[o.type];
    showCard(it.icon, o.group.userData.title || it.label, FACTS[o.type] || '', false);
    markSelected();
  }
  function closeCard() {
    selected = null;
    cardEl.hidden = true;
    selHl.visible = false;
  }
  function turnSelected() {
    const o = selected; if (!o) return;
    const it = ITEMS[o.type], nr = (o.rot + 1) % 4;
    const [w, h] = footprint(it, nr);
    for (let dz = 0; dz < o.h; dz++) for (let dx = 0; dx < o.w; dx++) cells[idx(o.x + dx, o.z + dz)] = null;
    let free = true;
    for (let dz = 0; dz < h && free; dz++) for (let dx = 0; dx < w; dx++) if (!inB(o.x + dx, o.z + dz) || cells[idx(o.x + dx, o.z + dz)]) { free = false; break; }
    if (free) { o.rot = nr; o.w = w; o.h = h; }
    for (let dz = 0; dz < o.h; dz++) for (let dx = 0; dx < o.w; dx++) cells[idx(o.x + dx, o.z + dz)] = o;
    if (!free) { sfx.nope(); toast('Not enough room to turn it here. Try moving it first!'); return; }
    o.group.position.set(o.x + w / 2 - N / 2, 0, o.z + h / 2 - N / 2);
    o.group.rotation.y = nr * Math.PI / 2;
    squish(o.group); sfx.road();
    markSelected(); changed();
  }
  function startMove() {
    const o = selected; if (!o) return;
    const it = ITEMS[o.type];
    moving = { type: o.type, seed: o.seed, rot: o.rot, r0: o.rot, x: o.x, z: o.z };
    removeObj(o);
    selected = null; selHl.visible = false;
    showCard('✋', `Moving: ${o.group.userData.title || it.label}`, 'Tap a green spot to put it down.', true);
    rebuildGhost(); sfx.boing();
  }
  function dropMoving(tx, tz) {
    const why = problemAt(tx, tz);
    if (why) { sfx.nope(); toast(MSG[why]); return; }
    const it = ITEMS[moving.type];
    const a = anchorFor(it, tx, tz, moving.rot);
    const m = moving; moving = null;
    const o = placeObj(m.type, a.x0, a.z0, m.rot, m.seed);
    cardEl.hidden = true;
    rebuildGhost(); sfx.place(); changed();
    if (o) squish(o.group);
  }
  function cancelMove() {
    if (!moving) return;
    const m = moving; moving = null;
    placeObj(m.type, m.x, m.z, m.r0, m.seed);
    cardEl.hidden = true;
    rebuildGhost(); changed();
  }
  document.getElementById('cardClose').onclick = () => { if (moving) cancelMove(); else closeCard(); };
  document.getElementById('cAgain').onclick = () => { ensureAudio(); if (selected) play(selected); };
  document.getElementById('cMove').onclick = startMove;
  document.getElementById('cTurn').onclick = turnSelected;
  document.getElementById('cRemove').onclick = () => {
    if (!selected) return;
    removeObj(selected); closeCard(); sfx.erase(); changed();
  };
  document.getElementById('cMoveTurn').onclick = () => { if (moving) { moving.rot = (moving.rot + 1) % 4; positionGhost(); sfx.road(); } };
  document.getElementById('cCancel').onclick = cancelMove;

  // a tap on the board that didn't hit a person, pet or vehicle
  function tapTile(tx, tz) {
    if (moving) { dropMoving(tx, tz); return; }
    const c = cellAt(tx, tz);
    if (tool !== 'erase' && c && c.type !== 'road') { play(c); openCard(c); return; }
    if (selected) { closeCard(); if (!c) return; }
    act(tx, tz);
  }

  function act(tx, tz) {
    const it = ITEMS[tool];
    if (it.kind === 'erase') { eraseAt(tx, tz); return; }
    const why = problemAt(tx, tz);
    if (why === 'same') return;
    if (why) {
      const c = cellAt(tx, tz);
      if (why === 'taken' && c) { squish(c.group); sfx.boing(); }
      else sfx.nope();
      toast(MSG[why]);
      return;
    }
    if (it.kind === 'build') {
      const a = anchorFor(it, tx, tz);
      placeObj(tool, a.x0, a.z0, rot, ghostSeed);
      ghostSeed = newSeed(); rebuildGhost(); sfx.place();
    } else if (it.kind === 'road') {
      placeObj('road', tx, tz, 0, 0); sfx.road();
    } else {
      const m = addMover(tool, tx, tz, ghostSeed);
      m.wait = .3;
      ghostSeed = newSeed(); rebuildGhost();
      poke(m);
    }
    changed();
  }

  /* ---------- pointer input ---------- */
  const ptrs = new Map();
  let drag = null;
  const isPaintTool = () => tool === 'road' || tool === 'erase';
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    ensureAudio();
    canvas.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) {
      drag = { sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, button: e.button, shift: e.shiftKey, painting: false, done: new Set() };
      hover = tileFromEvent(e); positionGhost();
      const under = hover && cellAt(hover.x, hover.z);
      const onBuilding = under && under.type !== 'road';
      if (isPaintTool() && !moving && e.button === 0 && hover && !moverFromEvent(e) && !(tool === 'road' && onBuilding)) {
        if (selected) closeCard();
        drag.painting = true;
        drag.done.add(hover.x + ',' + hover.z);
        act(hover.x, hover.z);
      }
    } else if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      drag = { pinch: true, d0: Math.hypot(a.x - b.x, a.y - b.y), dist0: cam.distT, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
      hl.visible = false; if (ghost) ghost.visible = false;
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (!drag) { if (e.pointerType === 'mouse') { hover = tileFromEvent(e); positionGhost(); } return; }
    if (drag.pinch) {
      if (ptrs.size < 2) return;
      const [a, b] = [...ptrs.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      cam.distT = clamp(drag.dist0 * drag.d0 / Math.max(d, 1), 7, 40);
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      panBy(mx - drag.mx, my - drag.my);
      drag.mx = mx; drag.my = my;
      return;
    }
    hover = tileFromEvent(e); positionGhost();
    if (drag.painting) {
      if (hover) { const key = hover.x + ',' + hover.z; if (!drag.done.has(key)) { drag.done.add(key); act(hover.x, hover.z); } }
      return;
    }
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly;
    drag.lx = e.clientX; drag.ly = e.clientY;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) > 7) drag.moved = true;
    if (drag.moved) {
      if (drag.button === 2 || drag.shift) panBy(dx, dy);
      else {
        cam.yawT -= dx * .008; cam.yaw = cam.yawT;
        cam.pitchT = clamp(cam.pitchT + dy * .004, .45, 1.35); cam.pitch = cam.pitchT;
      }
    }
  });
  function endPointer(e) {
    ptrs.delete(e.pointerId);
    if (!drag) return;
    if (drag.pinch) { if (ptrs.size === 0) drag = null; return; }
    if (e.type === 'pointerup' && !drag.moved && !drag.painting && drag.button === 0) {
      const m = moverFromEvent(e);
      if (m && !moving) { if (tool === 'erase') { removeMover(m); sfx.erase(); changed(); } else poke(m); }
      else { const t = tileFromEvent(e); if (t) tapTile(t.x, t.z); }
    }
    drag = null;
    if (e.pointerType !== 'mouse') { hover = null; positionGhost(); }
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', e => { if (!drag && e.pointerType === 'mouse') { hover = null; positionGhost(); } });
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY > 0 ? 1.1 : 1 / 1.1); }, { passive: false });

  /* ---------- rail buttons + keys ---------- */
  const spin = d => { cam.yawT += d * Math.PI / 4; };
  document.getElementById('rotL').onclick = () => spin(-1);
  document.getElementById('rotR').onclick = () => spin(1);
  document.getElementById('zoomIn').onclick = () => zoomBy(1 / 1.2);
  document.getElementById('zoomOut').onclick = () => zoomBy(1.2);
  const turn = () => {
    if (moving) { moving.rot = (moving.rot + 1) % 4; positionGhost(); sfx.road(); return; }
    if (selected) { turnSelected(); return; }
    const it = ITEMS[tool];
    if (it.kind !== 'build') { toast('Pick a building first, then you can turn it.'); return; }
    rot = (rot + 1) % 4; positionGhost();
    if (ghost && !hover) toast('Turned! Now tap where it should go.', 1400);
  };
  document.getElementById('turn').onclick = turn;
  nightBtn.onclick = () => { ensureAudio(); setNight(!night); changed(); };
  const muteBtn = document.getElementById('mute');
  muteBtn.onclick = () => {
    muted = !muted; ensureAudio();
    muteBtn.textContent = muted ? '🔇' : '🔊';
    muteBtn.setAttribute('aria-label', muted ? 'Turn sound on' : 'Turn sound off');
  };
  const clearBtn = document.getElementById('clear');
  let clearArmed = 0;
  clearBtn.onclick = () => {
    if (clearArmed) {
      clearTimeout(clearArmed); clearArmed = 0;
      clearBtn.classList.remove('warn'); clearBtn.textContent = '🗑️';
      moving = null; closeCard();
      clearTown(); rebuildGhost(); changed(); sfx.erase();
      toast('A fresh new island! Start building. 🌱');
      return;
    }
    clearBtn.classList.add('warn'); clearBtn.textContent = 'Sure?';
    toast('Tap “Sure?” to clear your whole town.');
    clearArmed = setTimeout(() => { clearArmed = 0; clearBtn.classList.remove('warn'); clearBtn.textContent = '🗑️'; }, 3000);
  };
  window.addEventListener('keydown', e => {
    if (e.target === nameEl) return;
    const k = e.key.toLowerCase();
    if (k === 'escape') { if (moving) cancelMove(); else closeCard(); }
    else if (k === 'r') turn();
    else if (k === 'q') spin(-1);
    else if (k === 'e') spin(1);
    else if (k === '+' || k === '=') zoomBy(1 / 1.2);
    else if (k === '-' || k === '_') zoomBy(1.2);
    else if (k === 'n') { setNight(!night); changed(); }
  });

  /* ---------- simulation ---------- */
  const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), tmpP = new THREE.Vector3();
  function stepMover(m, dt, time) {
    if (m.life !== undefined) { m.life -= dt; if (m.life <= 0) { removeMover(m); return; } }
    if (m.it.vehicle) {
      if (!isRoad(m.to.x, m.to.z) || !isRoad(m.from.x, m.from.z)) { removeMover(m); return; }
    } else if (!walkable(m.to.x, m.to.z)) {
      if (walkable(m.from.x, m.from.z)) { m.to = { ...m.from }; m.t = 1; } else { removeMover(m); return; }
    }
    let moving = false;
    if (m.wait > 0) m.wait -= dt;
    else {
      let blocked = false;
      if (m.it.vehicle) {
        for (const o of movers) {
          if (o === m || !o.it.vehicle) continue;
          const same = o.from.x === m.from.x && o.from.z === m.from.z && o.to.x === m.to.x && o.to.z === m.to.z;
          if (same && o.t > m.t && o.t - m.t < .55) { blocked = true; break; }
          const ahead = o.from.x === m.to.x && o.from.z === m.to.z && !(o.to.x === m.from.x && o.to.z === m.from.z);
          if (ahead && o.t + 1 - m.t < .55) { blocked = true; break; }
        }
      }
      if (!blocked) {
        m.t += dt * m.speed; moving = true;
      }
      if (m.t >= 1) {
        const n = nextTile(m);
        if (n) { m.from = m.to; m.to = n; m.t -= 1; }
        else { m.t = 1; moving = false; }
        if (!m.it.vehicle && Math.random() < .18) m.wait = .6 + Math.random() * 2.2;
      }
    }
    tmpA.copy(tileWorld(m.from.x, m.from.z));
    tmpB.copy(tileWorld(m.to.x, m.to.z));
    tmpP.lerpVectors(tmpA, tmpB, Math.min(m.t, 1));
    const dx = tmpB.x - tmpA.x, dz = tmpB.z - tmpA.z;
    if (dx || dz) {
      const want = Math.atan2(dx, dz);
      let d = want - m.yaw; d = Math.atan2(Math.sin(d), Math.cos(d));
      m.yaw += d * Math.min(1, dt * 9);
      if (m.it.vehicle) { tmpP.x += -dz * .2; tmpP.z += dx * .2; }
      else { tmpP.x += -dz * m.off; tmpP.z += dx * m.off; }
    } else moving = false;
    m.pos.lerp(tmpP, Math.min(1, dt * 10));
    let y = m.it.vehicle ? .03 : .01;
    if (!m.it.vehicle && moving && m.wait <= 0) y += Math.abs(Math.sin(time * (m.type === 'dog' ? 14 : 10) + m.phase)) * .035;
    if (m.jump > 0) { m.jump = Math.max(0, m.jump - dt * 2.2); y += Math.sin((1 - m.jump) * Math.PI) * (m.it.vehicle ? .15 : .3); }
    m.g.position.set(m.pos.x, y, m.pos.z);
    m.g.rotation.y = m.yaw;
    if (m.g.userData.siren) {
      m.sirenT = Math.max(0, (m.sirenT || 0) - dt);
      const on = (m.sirenT > 0 || nightK > .5) && Math.floor(time * 6) % 2 === 0;
      m.g.userData.siren[0].material = mat(on ? '#ff3b30' : '#8a1f1a');
      m.g.userData.siren[1].material = mat(on ? '#1d3f8f' : '#2979ff');
    }
  }

  /* ---------- loop ---------- */
  function resize() {
    const w = app.clientWidth, h = app.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(app);

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    const time = now / 1000;
    nightK += ((night ? 1 : 0) - nightK) * Math.min(1, dt * 2.5);
    applyLighting();
    updateCamera(dt);
    for (let i = movers.length - 1; i >= 0; i--) if (movers[i]) stepMover(movers[i], dt, time);
    for (const o of objs) {
      const u = o.group.userData;
      if (u.duck) {
        const d = u.duck.userData, a = time * .6 + d.phase;
        d.jump = Math.max(0, (d.jump || 0) - dt * 2);
        u.duck.position.set(Math.cos(a) * .22, .02 + Math.sin(time * 3) * .008 + Math.sin(d.jump * Math.PI) * .2, Math.sin(a) * .22);
        u.duck.rotation.y = -a;
      }
      if (u.flag) u.flag.rotation.y = Math.sin(time * 3) * .25;
    }
    for (const c of clouds) { c.position.x += c.userData.speed * dt; if (c.position.x > 24) c.position.x = -24; }
    runAnims(dt);
    runFloaters(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  /* ---------- start ---------- */
  function start(hotData) {
    let data = hotData && hotData.town;
    if (!data) { try { const s = localStorage.getItem(SAVE_KEY); if (s) data = JSON.parse(s); } catch (e) { data = null; } }
    resize();
    cam.dist = cam.distT = fitDistance();
    renderTabs(); renderItems();
    loadTown(data || starterTown(), false);
    setTool('house');
    window.claude?.hot?.snapshot?.(() => ({ town: serialize() }));
    toast('Tap the grass to build. Tap a building to play with it!', 5000);
    requestAnimationFrame(t => { last = t; frame(t); });
  }
  const fontsReady = document.fonts ? Promise.race([document.fonts.load('800 40px "Baloo 2"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
  fontsReady.catch(() => {}).then(() => {
    window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
  });
})();
</script>
</body>
</html>
